<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>채팅 서고</title>
<script>
(function(){try{var t=localStorage.getItem('archive-theme');
if(t){document.documentElement.dataset.theme=t;}}catch(e){}})();
</script>
<style>
@font-face{
  font-family:"RIDIBatang";
  src:url("./assets/RIDIBatang.otf") format("opentype");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#151221; --panel:#1e1a2c; --panel2:#272138; --line:#37304e; --line2:#453c63;
  --text:#e9e2d4; --dim:#9d94b0; --faint:#6f6786;
  --gold:#c9a96a; --gold-soft:#e3ce9f; --gold-dim:#8b7550;
  --lav:#a893d8; --lav-soft:#c7b8ea; --self:#241e39;
  --danger:#d98a8a; --primary-ink:#241d10;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f3efe4; --panel:#fbf8f0; --panel2:#ece6d6; --line:#e0d8c4; --line2:#cfc4a9;
  --text:#332c3e; --dim:#6e6580; --faint:#9c92ab;
  --gold:#8a6b28; --gold-soft:#6d5314; --gold-dim:#c2ad7f;
  --lav:#b0526e; --lav-soft:#96405c; --self:#f6e9ee;
  --danger:#b3524e; --primary-ink:#fbf6ea;
  color-scheme:light;
}
html[data-theme="light"] .doc,
html[data-theme="light"] .panel{box-shadow:0 1px 3px rgba(58,47,82,.07)}
#theme-btn{min-width:40px;text-align:center}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:15px;line-height:1.6}
a{color:inherit;text-decoration:none}
mark{background:transparent;color:var(--gold-soft);border-bottom:1px solid var(--gold);padding:0 1px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.16em;color:var(--gold);white-space:nowrap}
.brand small{display:block;letter-spacing:.32em;font-weight:400;color:var(--faint);font-size:10px;margin-top:2px}
.spacer{flex:1}
.btn{display:inline-block;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;
  background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--gold-dim);color:var(--gold-soft)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--primary-ink);font-weight:700}
.btn.primary:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--primary-ink)}
.btn.danger{color:var(--danger);border-color:#5a3b46}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
input[type=text],input[type=date],input[type=password],textarea,select{
  width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;
  color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-dim)}
textarea{resize:vertical;line-height:1.7}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;letter-spacing:.06em}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* ---- 목록 ---- */
.searchbar{display:flex;gap:8px;margin:22px 0 14px}
.searchbar input{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--dim)}
.chip:hover{border-color:var(--gold-dim);color:var(--gold-soft)}
.chip.on{border-color:var(--gold);color:var(--gold-soft);background:var(--panel2)}
.chip .n{color:var(--faint);margin-left:4px}
.doc{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin-bottom:12px}
.doc:hover{border-color:var(--gold-dim)}
.doc h3{margin:0 0 6px;font-size:16.5px;font-weight:700}
.doc .meta{font-size:12.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.doc .meta b{color:var(--gold);font-weight:600}
.doc .meta i{font-style:normal;color:var(--lav)}
.doc .snip{font-size:13.5px;color:var(--dim);line-height:1.65}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:44px 24px;text-align:center;color:var(--dim)}
.empty b{color:var(--gold);display:block;margin-bottom:8px;font-size:16px}
.empty span{display:block;margin-top:6px;font-size:13px;color:var(--faint)}
.count{color:var(--faint);font-size:12.5px;margin:0 0 12px}
.count a{color:var(--gold)}
.shelf-h{font-size:12px;letter-spacing:.24em;color:var(--gold);margin:26px 0 12px;font-weight:600}
.shelf-h .sub{color:var(--faint);letter-spacing:0;font-weight:400}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:6px}
.folder{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden}
.folder::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent)}
.folder:hover{border-color:var(--gold-dim)}
.folder .fname{font-weight:700;font-size:15px;margin-bottom:5px}
.folder .fmeta{font-size:12px;color:var(--dim)}
.fold{color:var(--gold);border:1px solid var(--gold-dim);border-radius:6px;padding:1px 8px;font-size:11.5px}
a.fold:hover{background:var(--panel2)}
.folder-head{margin:24px 0 2px}
.folder-head h1{font-size:20px;margin:0 0 6px}
.folder-head .fmeta{font-size:12.5px;color:var(--dim)}
.folder-head .fmeta a{color:var(--gold)}

/* ---- 리더 ---- */
.reader{max-width:720px;margin:0 auto;
  font-family:"RIDIBatang","리디바탕","Noto Serif KR","Nanum Myeongjo","Apple Myungjo",Batang,"바탕",serif;
  font-size:16.5px;line-height:1.95;letter-spacing:.005em}
.reader-head{margin:34px auto 10px;max-width:720px}
.reader-head h1{font-size:21px;margin:0 0 8px;font-weight:700}
.reader-head .meta{font-size:13px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.reader-head .meta b{color:var(--gold)}.reader-head .meta i{font-style:normal;color:var(--lav)}
.turn-mark{display:flex;align-items:center;gap:16px;margin:52px 0 26px;color:var(--gold);scroll-margin-top:76px}
.turn-mark::before,.turn-mark::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim));opacity:.55}
.turn-mark::after{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.turn-mark span{font-size:13px;letter-spacing:.34em;padding-left:.34em}
.blk{margin:0 0 26px}
.blk .who{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:11.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:8px}
.blk .para{margin:0 0 15px}
.blk .para:last-child{margin-bottom:0}
.blk p{margin:0}
.blk p.dlg{color:var(--gold-soft);padding-left:12px;border-left:2px solid var(--gold-dim);margin:4px 0}
.blk .q{color:var(--gold-soft)}
.blk.self .q{color:var(--lav-soft)}
.blk.self{max-width:88%;margin-left:auto;background:var(--self);border:1px solid var(--line);
  border-radius:14px 4px 14px 14px;padding:13px 16px;font-size:14.5px;line-height:1.8;
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.blk.self .who{color:var(--lav);text-align:right}
.blk.self p.dlg{color:var(--lav-soft);border-left-color:var(--lav)}
.blk.other .who{color:var(--dim)}
.readerbar{display:flex;gap:8px;align-items:center}
.readerbar select{width:auto;padding:6px 8px;font-size:13px}
/* ---- 기록 내 검색 ---- */
.docsearch{display:flex;gap:8px;margin:16px auto 0;max-width:720px;flex-wrap:wrap;
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.docsearch form{display:flex;gap:6px;align-items:center;margin:0}
.docsearch form.qsf{flex:1 1 220px}
.docsearch input{padding:7px 10px;font-size:13.5px}
.docsearch #ts-no{width:104px}
.docsearch #qs-q{flex:1;width:auto;min-width:120px}
.ts-msg{max-width:720px;margin:7px auto 0;font-size:12.5px;color:var(--danger);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.ts-msg:empty{display:none}
mark.hl{background:color-mix(in srgb,var(--gold) 26%,transparent);color:inherit;
  border-bottom:1px solid var(--gold);border-radius:2px;padding:0 1px}
mark.hl.cur{background:var(--gold);color:var(--primary-ink)}
.findbar{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px)}
.findbar-in{max-width:860px;margin:0 auto;padding:9px 18px;display:flex;gap:8px;align-items:center;
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;color:var(--dim)}
.findbar-in b{color:var(--gold-soft);font-weight:600;max-width:34%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.findbar-in .pos{white-space:nowrap}
.findbar-in .fsp{flex:1}
.pagenav{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:20px 0 6px;font-size:12.5px;color:var(--dim);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.pagenav span{white-space:nowrap}
.backline{margin:26px 0 0}
hr.endmark{border:none;height:1px;margin:60px auto 0;max-width:200px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}

/* ---- 새 기록 / 편집 ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:20px 0}
.panel h2{margin:0 0 16px;font-size:16px;color:var(--gold);letter-spacing:.08em}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.6}
.notice{border:1px solid var(--gold-dim);background:var(--panel2);border-radius:10px;
  padding:10px 14px;font-size:13px;color:var(--gold-soft);margin:0 0 14px}
.notice a{color:var(--gold-soft);text-decoration:underline}
.warn{border-color:#7a5a5a;color:var(--danger)}
#preview .reader{font-size:15px}
#preview{min-height:60px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.pv-note{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.tabs{display:flex;gap:8px;margin:4px 0 16px}
.tab{border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
  border-radius:8px;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:13.5px}
.tab.on{border-color:var(--gold);color:var(--gold-soft);background:var(--panel)}
.cap{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
  padding:14px 14px 12px;margin-bottom:12px}
.cap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cap-no{display:flex;align-items:center;gap:7px;color:var(--gold);font-weight:700;font-size:14px}
.cap-no input{width:70px;text-align:center;padding:5px 6px;font-size:14px;font-weight:700;
  background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:inherit}
.cap-del{border:none;background:none;color:var(--faint);cursor:pointer;font-size:17px;padding:2px 7px}
.cap-del:hover{color:var(--danger)}
.cap label{margin-top:8px}
.cap textarea{overflow:hidden;min-height:44px}
@media(max-width:640px){body{font-size:14.5px}.reader{font-size:15.5px;line-height:1.9}}

/* ---- SPA 전용 추가 ---- */
#topbar-extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.settings-note{font-size:13px;color:var(--dim);line-height:1.75;margin-top:14px}
.settings-note b{color:var(--gold-soft)}
.settings-note code{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;
  padding:1px 6px;font-size:12px}

/* ---- 파일 백업 (txt 자동 감지) ---- */
.drop{border:2px dashed var(--line2);border-radius:14px;padding:34px 20px;text-align:center;
  color:var(--dim);cursor:pointer;margin:0 0 12px;transition:border-color .15s,background .15s}
.drop:hover,.drop:focus-visible{border-color:var(--gold-dim);outline:none}
.drop.over{border-color:var(--gold);background:var(--panel2);color:var(--gold-soft)}
.drop b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.drop .link{color:var(--gold);text-decoration:underline}
.hint code{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:12px 0 0;cursor:pointer;letter-spacing:0}
.chk input{width:auto;margin:0;accent-color:var(--gold)}
.badge{display:inline-block;border:1px solid var(--gold-dim);color:var(--gold);border-radius:6px;
  padding:1px 8px;font-size:11.5px;font-weight:600;margin-left:8px;vertical-align:1px;white-space:nowrap}
.badge.warn{border-color:#7a5a5a;color:var(--danger)}
.imp-card .cap-no{font-size:14px;min-width:0}
.imp-card .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.imp-card.saved{opacity:.72}
.imp-stat{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.7}
.imp-stat b{color:var(--gold);font-weight:600}
.imp-card .field{margin-bottom:10px}
.imp-card .grid2{margin-top:4px}
.imp-card input[readonly]{color:var(--dim);background:var(--panel2)}
.imp-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.imp-foot .ok{color:var(--gold-soft);font-weight:600}
.imp-msg{font-size:12.5px;color:var(--faint)}
.imp-msg.err{color:var(--danger)}
.imp-preview{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.imp-preview .reader{font-size:15px}

/* ---- 분기 ---- */
.branch-line{display:flex;align-items:baseline;gap:8px;margin:-12px 0 26px;padding:9px 14px;
  border:1px solid var(--gold-dim);border-radius:10px;background:var(--panel);color:var(--gold-soft);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13.5px;line-height:1.5}
.branch-line:hover{background:var(--panel2);border-color:var(--gold)}
.branch-line .arrow{color:var(--gold);font-weight:700}
.branch-line .note{color:var(--dim);margin-left:auto;white-space:nowrap;font-size:12.5px}
.branch-line.up{border-style:dashed;color:var(--dim)}
.branch-line.up:hover{color:var(--gold-soft)}
.turn-mark.inh{opacity:.6}
.blk.inh{opacity:.62}
.blk.inh:hover{opacity:1}
.branch-note{max-width:720px;margin:14px auto 0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.branch-note a{color:var(--gold-soft);text-decoration:underline}
.doc.sub{padding:10px 16px;margin-top:-6px;font-size:13.5px;color:var(--dim);border-style:dashed;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.doc.sub .arrow{color:var(--gold);font-weight:700}
.doc.sub b{color:var(--gold)}
.doc.sub .submeta{color:var(--faint);font-size:12.5px;margin-left:auto}
.fold.branch{border-style:dashed;color:var(--dim)}
.reader-head .meta u{text-decoration:none;color:var(--gold)}
/* ---- 목록(서가 안)에서 바로 삭제 ---- */
.docrow{position:relative}
.docrow.has-del>.doc h3{padding-right:56px}
.docrow.sub.has-del>.doc{padding-right:56px}
.doc-del{position:absolute;top:12px;right:12px;border:1px solid transparent;background:none;
  color:var(--faint);cursor:pointer;font-family:inherit;font-size:12px;line-height:1.4;
  padding:3px 8px;border-radius:6px;white-space:nowrap}
.doc-del:hover{color:var(--danger);border-color:#5a3b46;background:var(--panel2)}
.doc-del[disabled]{opacity:.55;cursor:default;color:var(--faint);border-color:transparent;background:none}
.docrow.sub .doc-del{top:7px;right:10px}

/* ---- 갤러리 (이미지 전용 저장소) ---- */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 6px}
@media(max-width:640px){.gal-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}}
.gal-item{position:relative;aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;cursor:pointer;display:block}
.gal-item:hover{border-color:var(--gold-dim)}
.gal-item img,.gcover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.gal-item img.ready,.gcover img.ready{opacity:1}
.gal-item .gname{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;line-height:1.3;
  color:#f3ecdf;background:linear-gradient(transparent,rgba(0,0,0,.62));white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.gerr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;
  color:var(--danger);padding:8px;text-align:center;background:var(--panel2)}
.folder.gal{padding:0;display:flex;flex-direction:column}
.folder.gal .gcover{aspect-ratio:4/3;background:var(--panel2);overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.folder.gal .fname{padding:10px 14px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder.gal .fname .n{color:var(--faint);font-weight:400;font-size:12px;margin-left:6px}
.folder.gal .fmeta{padding:0 14px 12px}
.gal-up{margin-top:22px}
.gal-up .drop{padding:22px 16px;margin-bottom:6px}
.gal-up .drop b{font-size:14px}
.gal-up .drop span{font-size:12.5px}
.gal-up .drop[aria-disabled="true"]{opacity:.55;cursor:default}
.gal-summary{font-size:12.5px;color:var(--faint);margin:0 0 4px;line-height:1.7}
.gal-summary b{color:var(--gold-soft);font-weight:600}
.gal-summary.err{color:var(--danger)}
/* 순서 바꾸기 — 썸네일은 브라우저 기본 드래그(파일로 떨어지는 것)를 막고, 포인터로 직접 옮긴다 */
.gal-item{-webkit-user-select:none;user-select:none}
.gal-item img,.gcover img,.lb-stage img{-webkit-user-drag:none}
.tb-set{display:contents}.tb-set[hidden]{display:none}
.gal-arr{border:1px solid var(--gold-dim);background:var(--panel2);border-radius:10px;padding:8px 12px;
  font-size:12.5px;color:var(--dim);line-height:1.6;margin:0 0 4px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.gal-arr b{color:var(--gold-soft);font-weight:600}
.gal-arr .st{margin-left:auto;color:var(--faint)}
.gal-arr .st.err{color:var(--danger)}
.gal-grid.arranging{counter-reset:gi}
.gal-grid.arranging .gal-item{cursor:grab;counter-increment:gi;touch-action:none;outline:1px dashed var(--line2);outline-offset:2px}
.gal-grid.arranging .gal-item:focus{outline:2px solid var(--gold);outline-offset:2px}
.gal-grid.arranging .gal-item::before{content:counter(gi);position:absolute;top:6px;left:6px;z-index:2;min-width:22px;height:22px;
  padding:0 6px;border-radius:11px;background:rgba(9,7,15,.72);color:#e3ce9f;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.gal-grid.arranging .gal-item.dragging{opacity:.28;outline:2px solid var(--gold)}
.gal-ghost{position:fixed;z-index:70;pointer-events:none;margin:0;opacity:.94;transform:scale(1.04);
  box-shadow:0 14px 40px rgba(0,0,0,.5);border-color:var(--gold);aspect-ratio:auto}
body.gal-dragging,body.gal-dragging *{cursor:grabbing!important}
/* 라이트박스 */
.lb{position:fixed;inset:0;z-index:60;background:rgba(9,7,15,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:12px;
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}

<body>
<div class="topbar"><div class="topbar-in">
  <a class="brand" href="#/">채팅 서고<small>PRIVATE ARCHIVE</small></a>
  <span class="spacer"></span>
  <span id="topbar-extra"></span>
  <button class="btn small" id="theme-btn" type="button" title="라이트 / 다크 전환">☀</button>
</div></div>
<div class="wrap" id="app">
<noscript><div class="empty" style="margin-top:60px"><b>자바스크립트가 꺼져 있어요</b>이 앱은 브라우저에서만 동작합니다.</div></noscript>
</div>
<script>
/* ============================================================
   채팅 서고 core — app.py의 파싱/직렬화/렌더링 로직 1:1 포팅
   (브라우저 전역 + node 테스트용 module.exports 겸용)
   ============================================================ */
(function (root) {
"use strict";

var APP_NAME = "채팅 서고";
var META_KEYS = ["title", "character", "persona", "date", "tags", "source", "branch_of", "branch_at"];
var PAGE_TURNS = 50;

/* ---------------- 정규식 (app.py와 동일) ---------------- */
var TURN_RE = /^\s*(\d{1,5})\s*턴\s*[.:]?\s*$/;
var MD_TURN_RE = /^##\s+(?:(\d{1,5})\s*턴|(.+?))\s*$/;
var MD_LABEL_RE = /^\*\*([^*\n]{1,24})\s*[:：]\*\*\s*(.*)$/;
var NAME_CAND_RE = /^\s*([^\s:：|“”"'’‘#*\-–—>\d][^\s:：|]{0,11})\s*[:：]\s*\S/gm;
var NAME_STOPWORDS = { "ooc": 1, "OOC": 1, "http": 1, "https": 1, "참고": 1, "주의": 1, "예시": 1, "요약": 1 };
var LABEL_FALLBACK_RE = /^\s*([^\s:：|“”"'#*>\d][^\s:：|]{0,11})\s*[:：]\s*(.*)$/;
var DLG_PIPE_RE = /^\s*[^\s|:：]{1,14}\s*\|\s*\S/;
var QUOTE_ESC_RE = /(“[^”]*”|&quot;.*?&quot;|「[^」]*」|『[^』]*』)/g;
var QUOTE_RAW_RE = /“[^”]*”|"[^"]*"|「[^」]*」|『[^』]*』/g;

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\\-]/g, "\\$&"); }

function rstrip(s) { return s.replace(/\s+$/, ""); }

/* html.escape(quote=True)와 동일한 이스케이프 */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#x27;");
}

function countOcc(hay, needle) {
  if (!needle) return 0;
  return hay.split(needle).length - 1;
}

function fmtNum(n) { return Number(n).toLocaleString("en-US"); }

function splitTags(s) {
  var out = [];
  String(s || "").split(/[,\s]+/).forEach(function (t) {
    t = t.trim();
    if (t) out.push(t);
  });
  return out;
}

/* ---------------- 화자 감지 / 라벨 ---------------- */
function labelRegex(names) {
  names = (names || []).filter(Boolean);
  if (names.length) {
    var uniq = [];
    names.forEach(function (n) { if (uniq.indexOf(n) < 0) uniq.push(n); });
    uniq.sort(function (a, b) { return b.length - a.length; });
    var alts = uniq.map(escapeRe).join("|");
    return new RegExp("^\\s*(" + alts + ")\\s*[:：]\\s*(.*)$");
  }
  return LABEL_FALLBACK_RE;
}

function detectNames(text) {
  var counts = new Map();
  var m;
  NAME_CAND_RE.lastIndex = 0;
  while ((m = NAME_CAND_RE.exec(text)) !== null) {
    var name = m[1].trim();
    if (NAME_STOPWORDS[name] || /^\d+$/.test(name)) continue;
    counts.set(name, (counts.get(name) || 0) + 1);
  }
  var ranked = Array.from(counts.entries());
  ranked.sort(function (a, b) {
    if (b[1] !== a[1]) return b[1] - a[1];
    return text.indexOf(a[0] + ":") - text.indexOf(b[0] + ":");
  });
  return ranked.map(function (kv) { return kv[0]; }).slice(0, 4);
}

/* ---------------- 파싱 ---------------- */
function newTurn(no, label) {
  return { no: (no === undefined ? null : no), label: (label === undefined ? null : label), blocks: [] };
}

function closePara(block, para) {
  if (block !== null && para.length) block.paras.push(para.join("\n"));
  para.length = 0;
}

function isJunkBlock(block, names) {
  var joined = block.paras.join("\n").trim();
  if (!joined) return true;
  var pat = joined;
  (names || []).forEach(function (n) {
    if (n) pat = pat.replace(new RegExp(escapeRe(n) + "\\s*[:：]", "g"), "");
  });
  pat = pat.replace(/[\s,，.·…\-–—/\\]+/g, "");
  return pat === "";
}

function parsePaste(text, names) {
  var labRe = labelRegex(names);
  var turns = [];
  var curTurn = null;
  var curBlock = null;
  var para = [];

  function ensureTurn() {
    if (curTurn === null) {
      curTurn = newTurn(null, "기록");
      turns.push(curTurn);
    }
  }

  String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").forEach(function (raw) {
    var line = rstrip(raw);
    var tm = TURN_RE.exec(line);
    if (tm) {
      closePara(curBlock, para);
      curBlock = null;
      curTurn = newTurn(parseInt(tm[1], 10));
      turns.push(curTurn);
      return;
    }
    var lm = labRe.exec(line);
    if (lm) {
      closePara(curBlock, para);
      ensureTurn();
      curBlock = { speaker: lm[1].trim(), paras: [] };
      curTurn.blocks.push(curBlock);
      var rest = lm[2].trim();
      if (rest) para.push(rest);
      return;
    }
    if (!line.trim()) {
      closePara(curBlock, para);
      return;
    }
    ensureTurn();
    if (curBlock === null) {
      curBlock = { speaker: null, paras: [] };
      curTurn.blocks.push(curBlock);
    }
    para.push(line.trim());
  });

  closePara(curBlock, para);

  var cleaned = [];
  turns.forEach(function (t) {
    t.blocks = t.blocks.filter(function (b) { return !isJunkBlock(b, names); });
    if (t.blocks.length) cleaned.push(t);
  });
  return cleaned;
}

function parseBody(body, names) {
  var turns = [];
  var curTurn = null;
  var curBlock = null;
  var para = [];

  function ensureTurn() {
    if (curTurn === null) {
      curTurn = newTurn(null, "기록");
      turns.push(curTurn);
    }
  }

  String(body).replace(/\r\n/g, "\n").split("\n").forEach(function (raw) {
    var line = rstrip(raw);
    var hm = MD_TURN_RE.exec(line);
    if (hm) {
      closePara(curBlock, para);
      curBlock = null;
      if (hm[1]) curTurn = newTurn(parseInt(hm[1], 10));
      else curTurn = newTurn(null, hm[2]);
      turns.push(curTurn);
      return;
    }
    var lm = MD_LABEL_RE.exec(line);
    if (lm) {
      closePara(curBlock, para);
      ensureTurn();
      curBlock = { speaker: lm[1].trim(), paras: [] };
      curTurn.blocks.push(curBlock);
      var rest = lm[2].trim();
      if (rest) para.push(rest);
      return;
    }
    if (!line.trim()) {
      closePara(curBlock, para);
      return;
    }
    ensureTurn();
    if (curBlock === null) {
      curBlock = { speaker: null, paras: [] };
      curTurn.blocks.push(curBlock);
    }
    para.push(line.trim());
  });

  closePara(curBlock, para);
  return turns.filter(function (t) { return t.blocks.length; });
}

function mergeTurns(old, news) {
  var byNo = new Map();
  old.forEach(function (t) { if (t.no !== null) byNo.set(t.no, t); });
  var overlapped = [];
  news.forEach(function (t) {
    if (t.no !== null && byNo.has(t.no)) {
      var target = byNo.get(t.no);
      t.blocks.forEach(function (b) { target.blocks.push(b); });
      overlapped.push(t.no);
    } else {
      old.push(t);
      if (t.no !== null) byNo.set(t.no, t);
    }
  });
  var numbered = old.filter(function (t) { return t.no !== null; });
  var unnumbered = old.filter(function (t) { return t.no === null; });
  numbered.sort(function (a, b) { return a.no - b.no; });
  return [unnumbered.concat(numbered), overlapped];
}

/* ---------------- frontmatter / 직렬화 ---------------- */
function parseFrontmatter(text) {
  var meta = {}, body = text;
  if (text.indexOf("---") === 0) {
    var m = text.match(/^---[ \t]*\n([\s\S]*?)\n---[ \t]*\n?/);
    if (m) {
      m[1].split(/\r\n|\r|\n/).forEach(function (line) {
        var i = line.indexOf(":");
        if (i >= 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      body = text.slice(m[0].length);
    }
  }
  return [meta, body];
}

function serializeDoc(meta, turns) {
  var out = ["---"];
  META_KEYS.forEach(function (k) {
    var v = String(meta[k] === undefined || meta[k] === null ? "" : meta[k]).trim();
    if (v) out.push(k + ": " + v);
  });
  out.push("---");
  out.push("");
  turns.forEach(function (t) {
    var head = (t.no !== null) ? ("## " + t.no + "턴") : ("## " + (t.label || "기록"));
    out.push(head);
    out.push("");
    t.blocks.forEach(function (b) {
      var paras = b.paras.slice();
      var rest;
      if (b.speaker && paras.length) {
        var first = paras[0];
        rest = paras.slice(1);
        var firstLines = first.split("\n");
        out.push("**" + b.speaker + ":** " + firstLines[0]);
        firstLines.slice(1).forEach(function (l) { out.push(l); });
      } else if (b.speaker) {
        out.push("**" + b.speaker + ":**");
        rest = [];
      } else {
        rest = paras;
        if (rest.length) {
          rest[0].split("\n").forEach(function (l) { out.push(l); });
          rest = rest.slice(1);
        }
      }
      rest.forEach(function (p) {
        out.push("");
        p.split("\n").forEach(function (l) { out.push(l); });
      });
      out.push("");
    });
  });
  return rstrip(out.join("\n")) + "\n";
}

/* ---------------- 이름/경로 ---------------- */
function slugify(title) {
  var s = String(title).trim().replace(/[^\p{L}\p{N}_가-힣ㄱ-ㅎㅏ-ㅣ-]+/gu, "-");
  s = s.replace(/-{2,}/g, "-").replace(/^-+|-+$/g, "");
  return s.slice(0, 40) || "기록";
}

function cleanFolder(name) {
  name = String(name || "").trim().replace(/[^\p{L}\p{N}_가-힣ㄱ-ㅎㅏ-ㅣ.\- ]+/gu, "");
  name = name.replace(/^[ .]+|[ .]+$/g, "");
  return name.slice(0, 40);
}

var DOC_SEG = "[\\p{L}\\p{N}_가-힣ㄱ-ㅎㅏ-ㅣ.\\- ]+";
var DOC_ID_RE = new RegExp("^(?:" + DOC_SEG + "/)?" + DOC_SEG + "$", "u");
function docIdValid(docId) {
  if (!docId || docId.indexOf("..") >= 0) return false;
  return DOC_ID_RE.test(docId);
}

/* 폴더를 뺀 파일 이름 — 분기 참조(branch_of)는 이걸로 저장해서 폴더를 옮겨도 끊기지 않게 */
function baseId(docId) { return String(docId || "").split("/").pop(); }

function mtimeFromId(docId) {
  var base = docId.split("/").pop();
  var m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-/.exec(base);
  if (!m) return 0;
  var d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  return d.getTime() / 1000;
}

/* ---------------- 문서 인덱스 ---------------- */
function docFromText(docId, text, extra) {
  extra = extra || {};
  text = String(text).replace(/\r\n/g, "\n");
  var fm = parseFrontmatter(text);
  var meta = fm[0], body = fm[1];
  var names = [meta.character || "", meta.persona || ""];
  var turns = parseBody(body, names);
  var nos = [];
  turns.forEach(function (t) { if (t.no !== null) nos.push(t.no); });
  var slash = docId.indexOf("/");
  var bAt = parseInt(meta.branch_at || "", 10);
  return {
    id: docId,
    raw: text,
    meta: meta,
    body: body,
    turns: turns,
    folder: slash >= 0 ? docId.slice(0, slash) : "",
    branchOf: (meta.branch_of || "").trim() || null,
    branchAt: isNaN(bAt) ? null : bAt,
    mtime: extra.mtime !== undefined ? extra.mtime : mtimeFromId(docId),
    sha: extra.sha || null,
    chars: body.length,
    n_turns: turns.length,
    turn_min: nos.length ? Math.min.apply(null, nos) : null,
    turn_max: nos.length ? Math.max.apply(null, nos) : null,
  };
}

function allFolders(index) {
  var f = new Map();
  index.forEach(function (d) {
    var name = d.folder || "";
    if (!name) return;
    if (!f.has(name)) f.set(name, { count: 0, chars: 0, mtime: 0 });
    var info = f.get(name);
    info.count += 1;
    info.chars += d.chars;
    info.mtime = Math.max(info.mtime, d.mtime || 0);
  });
  var arr = Array.from(f.entries());
  arr.sort(function (a, b) { return b[1].mtime - a[1].mtime; });
  return arr;
}

function byCountThenName(a, b) {
  if (b[1] !== a[1]) return b[1] - a[1];
  return a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0);
}

function allTags(index) {
  var tags = new Map();
  index.forEach(function (d) {
    splitTags(d.meta.tags || "").forEach(function (t) {
      tags.set(t, (tags.get(t) || 0) + 1);
    });
  });
  return Array.from(tags.entries()).sort(byCountThenName);
}

function allCharacters(index) {
  var chars = new Map();
  index.forEach(function (d) {
    var c = (d.meta.character || "").trim();
    if (c) chars.set(c, (chars.get(c) || 0) + 1);
  });
  return Array.from(chars.entries()).sort(byCountThenName);
}

function searchDocs(index, q, who, tag, folder) {
  var rows = [];
  q = (q || "").trim();
  index.forEach(function (d, docId) {
    var meta = d.meta;
    if (folder && (d.folder || "") !== folder) return;
    if (who && (meta.character || "").trim() !== who) return;
    if (tag) {
      if (splitTags(meta.tags || "").indexOf(tag) < 0) return;
    }
    var score = 0, pos = -1;
    if (q) {
      var hitsTitle = countOcc(meta.title || "", q);
      var hitsBody = countOcc(d.body, q);
      var hitsTags = countOcc(meta.tags || "", q);
      if (hitsTitle + hitsBody + hitsTags === 0) return;
      score = hitsTitle * 20 + hitsTags * 10 + hitsBody;
      pos = d.body.indexOf(q);
    }
    rows.push({ score: score, id: docId, d: d, pos: pos });
  });
  if (q) {
    rows.sort(function (a, b) { return b.score - a.score; });
  } else {
    rows.sort(function (a, b) {
      var da = a.d.meta.date || "", db = b.d.meta.date || "";
      if (da !== db) return da < db ? 1 : -1;
      return (b.d.mtime || 0) - (a.d.mtime || 0);
    });
  }
  return rows;
}

function makeSnippet(body, q, pos, width) {
  width = width || 64;
  if (pos < 0) {
    var bs = body.trim();
    var plain = bs ? bs.split("\n\n")[0] : "";
    plain = plain.replace(/^\*\*[^*]+:\*\*\s*/, "");
    plain = plain.replace(/^##.+$/gm, "").trim().replace(/\n/g, " ");
    return escapeHtml(plain.slice(0, width * 2)) + (plain.length > width * 2 ? "…" : "");
  }
  var start = Math.max(0, pos - width);
  var end = Math.min(body.length, pos + q.length + width);
  var frag = body.slice(start, end).replace(/\n/g, " ");
  var prefix = start > 0 ? "…" : "";
  var suffix = end < body.length ? "…" : "";
  var esc = escapeHtml(frag);
  esc = esc.split(escapeHtml(q)).join("<mark>" + escapeHtml(q) + "</mark>");
  return prefix + esc + suffix;
}

/* ---------------- 렌더링 ---------------- */
function renderLine(ln) {
  var esc = escapeHtml(ln);
  var n = 0;
  esc = esc.replace(QUOTE_ESC_RE, function (m) { n += 1; return '<span class="q">' + m + "</span>"; });
  var dlg = "";
  if (DLG_PIPE_RE.test(ln)) {
    dlg = " dlg";
  } else if (n) {
    var residual = ln.replace(QUOTE_RAW_RE, "");
    residual = residual.replace(/[\s.,·…!?~\-—–]+/g, "");
    dlg = residual === "" ? " dlg" : "";
  }
  return '<p class="ln' + dlg + '">' + esc + "</p>";
}

/* opt.links: { turnNo: [{href, label, note}] } — 그 턴 구분선 아래에 분기 링크 줄을 그린다
   t.inh === true 인 턴은 원본에서 물려받은 부분(분기 기록에서만) */
function renderTurns(turns, persona, character, opt) {
  opt = opt || {};
  var links = opt.links || {};
  var out = [];
  turns.forEach(function (t) {
    var anchor = t.no !== null ? "t" + t.no : "";
    var label = t.no !== null ? t.no + "턴" : (t.label || "기록");
    out.push('<div class="turn-mark' + (t.inh ? " inh" : "") + '" id="' + anchor + '"><span>' + escapeHtml(label) + "</span></div>");
    if (t.no !== null && links[t.no]) {
      links[t.no].forEach(function (l) {
        out.push('<a class="branch-line' + (l.cls ? " " + l.cls : "") + '" href="' + escapeHtml(l.href) + '">' +
          '<span class="arrow">↳</span> ' + escapeHtml(l.label) +
          (l.note ? '<span class="note">' + escapeHtml(l.note) + "</span>" : "") + "</a>");
      });
    }
    t.blocks.forEach(function (b) {
      var sp = (b.speaker || "").trim();
      var cls;
      if (sp && sp === persona) cls = "self";
      else if (sp && sp === character) cls = "chara";
      else cls = "other";
      if (t.inh) cls += " inh";
      out.push('<div class="blk ' + cls + '">');
      if (sp) out.push('<div class="who">' + escapeHtml(sp) + "</div>");
      b.paras.forEach(function (p) {
        out.push('<div class="para">');
        p.split("\n").forEach(function (l) { out.push(renderLine(l)); });
        out.push("</div>");
      });
      out.push("</div>");
    });
  });
  return out.join("\n");
}

function metaLine(meta, d) {
  var parts = [];
  if (meta.character) parts.push("<b>" + escapeHtml(meta.character) + "</b>");
  if (meta.persona) parts.push("<i>" + escapeHtml(meta.persona) + "</i>");
  if (d !== undefined && d !== null) {
    if (d.branchAt !== null && d.branchAt !== undefined) {
      parts.push("<u>" + d.branchAt + "턴부터 분기</u>" + (d.turn_max !== null ? " · ~" + d.turn_max + "턴" : "") + " · " + d.n_turns + "개");
    } else if (d.turn_min !== null) {
      var rng = d.turn_min !== d.turn_max ? d.turn_min + "~" + d.turn_max + "턴" : d.turn_min + "턴";
      parts.push(rng + " · " + d.n_turns + "개");
    }
    parts.push(fmtNum(d.chars) + "자");
  }
  if (meta.date) parts.push(escapeHtml(meta.date));
  splitTags(meta.tags || "").forEach(function (t) {
    parts.push("#" + escapeHtml(t));
  });
  return parts.length ? "<span>" + parts.join("</span><span>") + "</span>" : "";
}

/* ---------------- 저장 관련 (api_* 로직) ---------------- */
function detectWithVolume(text) {
  var names = detectNames(text);
  if (names.length >= 2) {
    var volume = {};
    names.forEach(function (n) { volume[n] = 0; });
    parsePaste(text, names).forEach(function (t) {
      t.blocks.forEach(function (b) {
        if (b.speaker !== null && volume.hasOwnProperty(b.speaker)) {
          b.paras.forEach(function (p) { volume[b.speaker] += p.length; });
        }
      });
    });
    names.sort(function (a, b) { return volume[b] - volume[a]; });
  }
  var turns = 0;
  String(text).split(/\r\n|\r|\n/).forEach(function (l) {
    if (TURN_RE.test(l)) turns += 1;
  });
  return { names: names, turns: turns };
}

function parsePayload(payload) {
  var character = (payload.character || "").trim();
  var persona = (payload.persona || "").trim();
  var names = [character, persona].filter(Boolean);
  var turns = parsePaste(payload.text || "", names);
  return { turns: turns, character: character, persona: persona };
}

function normalizeTags(s) {
  return String(s || "").trim().replace(/,+$/, "").replace(/^,+/, "").replace(/\s*,\s*/g, ", ");
}

/* ---------------- 파일 가져오기: txt 내보내기 형식 자동 감지 / 파싱 ----------------
   지원 형식
   1) caveduck : 블록이 ----로 나뉘고 첫 줄이 [나] / [캐릭터] / [이름] 인 Caveduck 내보내기
   2) stamped  : "# 대화 내역: 제목" 머리말 + "[2026. 9. 12. PM 8:55:05] 이름:" 줄로 시작하는 메시지
   3) turns    : "캐릭터: / 채팅방 이름: / 페르소나 이름:" 머리말 + [턴 N] → 내 입력, --- 아래가 캐릭터 응답
   4) generic  : 그 밖의 파일 → 통짜 붙여넣기(parsePaste)와 같은 방식
   파싱 결과는 이름 대신 role(user/char/other)을 들고 있다가, 저장 직전에
   materializeImport()로 실제 이름표를 붙인다 (폼에서 이름을 고쳐도 그대로 반영되도록).
   ---------------------------------------------------------------------------- */
var ZWSP = "\u200B";
var IMPORT_FORMATS = {
  caveduck: "Caveduck 내보내기",
  stamped: "타임스탬프 대화 내역",
  turns: "[턴 N] 기록",
  generic: "일반 형식",
};
var USER_TAGS = ["나", "유저", "user", "User", "USER", "You", "you"];
var CD_TAG_RE = /^\[([^\[\]]{1,24})\]$/;
var CD_SEP_RE = /^-{4,}$/;
var CD_MARK_RE = /^[▶►▷➤→]+$/;
var STAMP_HDR_RE = /^\[([^\]]*\d[^\]]*)\]\s+([^:：\[\]]{1,24}?)\s*[:：]\s*$/;
var STAMP_DATE_RE = /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/;
var TURN_TAG_RE = /^\[\s*(?:턴|turn)\s*(\d{1,5})\s*\]$/i;
var TURN_HDR_RE = /^(캐릭터|채팅방 이름|페르소나 이름|페르소나)\s*[:：]\s*(.*)$/;
var HUD_RE = /<([A-Za-z_]*HUD)\b[\s\S]*?(?:\/>|<\/\1\s*>)/g;
var HUD_TEST_RE = /<[A-Za-z_]*HUD\b/;

function normalizeImportText(text) {
  return String(text).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

/* 줄 배열 → 문단 배열 (빈 줄이 문단 경계, 문단 안 줄은 \n으로 이어붙임) */
function linesToParas(lines) {
  var paras = [], cur = [];
  lines.forEach(function (l) {
    var t = String(l).trim();
    if (!t) { if (cur.length) { paras.push(cur.join("\n")); cur = []; } return; }
    cur.push(t);
  });
  if (cur.length) paras.push(cur.join("\n"));
  return paras;
}

/* 본문 줄이 "## …" 나 "**이름:**" 으로 시작하면 저장 후 다시 읽을 때 턴/화자 구분으로
   오해되므로, 보이지 않는 문자(U+200B)를 앞에 붙여 지켜준다. */
function guardPara(p) {
  return p.split("\n").map(function (l) {
    return (/^##\s/.test(l) || MD_LABEL_RE.test(l)) ? ZWSP + l : l;
  }).join("\n");
}

function isoDateFrom(m) {
  var p = function (n) { return String(n).padStart(2, "0"); };
  return m[1] + "-" + p(m[2]) + "-" + p(m[3]);
}

/* 메시지 목록에 role을 매긴다. 이름 없음 → char, 나/유저 → user,
   [캐릭터] 또는 가장 많이 말한 이름 → char, 나머지 이름 → other(이름 그대로 저장) */
function assignRoles(msgs) {
  var counts = new Map();
  msgs.forEach(function (m) {
    if (!m.name || USER_TAGS.indexOf(m.name) >= 0 || m.name === "캐릭터") return;
    counts.set(m.name, (counts.get(m.name) || 0) + 1);
  });
  var best = "", bestN = 0;
  counts.forEach(function (n, k) { if (n > bestN) { best = k; bestN = n; } });
  msgs.forEach(function (m) {
    if (!m.name) m.role = "char";
    else if (USER_TAGS.indexOf(m.name) >= 0) m.role = "user";
    else if (m.name === "캐릭터" || m.name === best) m.role = "char";
    else m.role = "other";
  });
  return best;
}

/* 메시지 → 턴. 내 입력이 나올 때마다 새 턴(번호는 나중에 순서대로), 그 앞의 캐릭터
   첫 메시지는 "시작"이라는 이름 없는 턴으로. */
function groupMessages(msgs) {
  var turns = [], cur = null;
  msgs.forEach(function (m) {
    if (!m.paras.length) return;
    if (m.role === "user") { cur = { no: null, seq: true, label: null, blocks: [] }; turns.push(cur); }
    else if (!cur) { cur = { no: null, seq: false, label: "시작", blocks: [] }; turns.push(cur); }
    cur.blocks.push({ role: m.role, name: m.name, paras: m.paras });
  });
  return turns;
}

function parseCaveduck(text) {
  var msgs = [], cur = null, expectTag = true, afterTag = false;
  function flush() {
    if (cur) { cur.paras = linesToParas(cur.lines); delete cur.lines; msgs.push(cur); }
    cur = null;
  }
  text.split("\n").forEach(function (raw) {
    var line = rstrip(raw), t = line.trim();
    if (CD_SEP_RE.test(t)) { flush(); expectTag = true; return; }
    if (expectTag) {
      if (!t) return;
      var m = CD_TAG_RE.exec(t);
      if (m) { cur = { name: m[1].trim(), lines: [] }; expectTag = false; afterTag = true; return; }
      cur = { name: null, lines: [] }; expectTag = false; afterTag = false;
    }
    if (afterTag) {                       // 이름표 바로 뒤의 ▶ 표시·빈 줄은 건너뛴다
      if (!t || CD_MARK_RE.test(t)) return;
      afterTag = false;
    }
    cur.lines.push(line);
  });
  flush();
  var character = assignRoles(msgs);
  return { format: "caveduck", title: "", character: character, persona: "", date: "",
    turns: groupMessages(msgs), hasHud: HUD_TEST_RE.test(text) };
}

function parseStamped(text) {
  var title = "", exportDate = "", firstDate = "", msgs = [], cur = null;
  function flush() {
    if (cur) { cur.paras = linesToParas(cur.lines); delete cur.lines; msgs.push(cur); }
    cur = null;
  }
  text.split("\n").forEach(function (raw) {
    var line = rstrip(raw);
    var hm = STAMP_HDR_RE.exec(line);
    if (hm) {
      flush();
      cur = { name: hm[2].trim(), lines: [] };
      if (!firstDate) { var dm = STAMP_DATE_RE.exec(hm[1]); if (dm) firstDate = isoDateFrom(dm); }
      return;
    }
    if (!cur) {                           // 첫 메시지 전의 "# 키: 값" 머리말
      var h = /^#\s*([^:：]+?)\s*[:：]\s*(.*)$/.exec(line.trim());
      if (h) {
        var k = h[1], v = h[2].trim();
        if (/대화 내역|제목|title/i.test(k)) title = v;
        else if (/내보내기|export/i.test(k)) { var dm2 = STAMP_DATE_RE.exec(v); if (dm2) exportDate = isoDateFrom(dm2); }
        return;
      }
      if (!line.trim()) return;
      cur = { name: null, lines: [] };
    }
    cur.lines.push(line);
  });
  flush();
  var character = assignRoles(msgs);
  return { format: "stamped", title: title, character: character, persona: "",
    date: firstDate || exportDate, turns: groupMessages(msgs), hasHud: HUD_TEST_RE.test(text) };
}

function parseTurnsFile(text) {
  var lines = text.split("\n");
  var meta = {}, i = 0;
  while (i < lines.length) {                // 머리말: "캐릭터: / 채팅방 이름: / 페르소나 이름:"
    var t0 = lines[i].trim();
    if (!t0) { i++; continue; }
    var h = TURN_HDR_RE.exec(t0);
    if (!h) break;
    meta[h[1]] = h[2].trim(); i++;
  }
  var turns = [], intro = [], curNo = null, curUser = [], curChar = [], inChar = false;
  function flushTurn() {
    if (curNo === null) {
      var ip = linesToParas(intro);
      if (ip.length) turns.push({ no: null, seq: false, label: "시작", blocks: [{ role: "char", name: null, paras: ip }] });
      intro = [];
      return;
    }
    var blocks = [], up = linesToParas(curUser), cp = linesToParas(curChar);
    if (up.length) blocks.push({ role: "user", name: null, paras: up });
    if (cp.length) blocks.push({ role: "char", name: null, paras: cp });
    if (blocks.length) turns.push({ no: curNo, seq: false, label: null, blocks: blocks });
  }
  for (; i < lines.length; i++) {
    var line = rstrip(lines[i]), t = line.trim();
    var tm = TURN_TAG_RE.exec(t);
    if (tm) { flushTurn(); curNo = parseInt(tm[1], 10); curUser = []; curChar = []; inChar = false; continue; }
    if (curNo === null) { intro.push(line); continue; }
    if (!inChar && /^-{3,}$/.test(t)) { inChar = true; continue; }   // 첫 --- 아래가 캐릭터 응답
    (inChar ? curChar : curUser).push(line);
  }
  flushTurn();
  return { format: "turns", title: meta["채팅방 이름"] || "", character: meta["캐릭터"] || "",
    persona: meta["페르소나 이름"] || meta["페르소나"] || "", date: "", turns: turns,
    hasHud: HUD_TEST_RE.test(text) };
}

function parseGeneric(text) {
  var det = detectWithVolume(text);
  var chr = det.names[0] || "", per = det.names[1] || "";
  var turns = parsePaste(text, [chr, per].filter(Boolean)).map(function (t) {
    return { no: t.no, seq: false, label: t.label, blocks: t.blocks.map(function (b) {
      var role = (per && b.speaker === per) ? "user" : ((chr && b.speaker === chr) ? "char" : "other");
      return { role: role, name: b.speaker, paras: b.paras };
    }) };
  });
  return { format: "generic", title: "", character: chr, persona: per, date: "",
    turns: turns, hasHud: HUD_TEST_RE.test(text) };
}

function detectImportFormat(text) {
  var lines = text.split("\n");
  var head = lines.slice(0, 12).join("\n");
  var nTurn = 0, nStamp = 0, nTag = 0, nSep = 0;
  lines.forEach(function (l) {
    var t = l.trim();
    if (TURN_TAG_RE.test(t)) nTurn++;
    else if (STAMP_HDR_RE.test(t)) nStamp++;
    else if (CD_SEP_RE.test(t)) nSep++;
    else if (CD_TAG_RE.test(t)) nTag++;
  });
  if (nTurn >= 1 || (/^캐릭터\s*[:：]/m.test(head) && /^페르소나(?: 이름)?\s*[:：]/m.test(head))) return "turns";
  if (nStamp >= 1 || /^#\s*대화 내역/m.test(head)) return "stamped";
  if (nSep >= 1 && nTag >= 1) return "caveduck";
  return "generic";
}

function niceTitle(stem, character) {
  var s = String(stem || "").replace(/_[0-9a-f]{6,}$/i, "").replace(/_+/g, " ").trim();
  if (!s || /^(caveduck[ _-]?chat|chat|export|conversation|대화|채팅)\d*$/i.test(s)) return character || s || "기록";
  return s;
}

function importStats(turns) {
  var st = { numbered: 0, seq: 0, intro: 0, blocks: 0, chars: 0, min: null, max: null, users: 0, chars_: 0 };
  turns.forEach(function (t) {
    if (t.no !== null) {
      st.numbered++;
      st.min = st.min === null ? t.no : Math.min(st.min, t.no);
      st.max = st.max === null ? t.no : Math.max(st.max, t.no);
    } else if (t.seq) st.seq++;
    else st.intro++;
    t.blocks.forEach(function (b) {
      st.blocks++;
      if (b.role === "user") st.users++; else if (b.role === "char") st.chars_++;
      b.paras.forEach(function (p) { st.chars += p.length; });
    });
  });
  st.turns = st.numbered + st.seq;
  return st;
}

function parseImportText(text, filename) {
  text = normalizeImportText(text);
  var fmt = detectImportFormat(text);
  var r = fmt === "turns" ? parseTurnsFile(text)
        : fmt === "stamped" ? parseStamped(text)
        : fmt === "caveduck" ? parseCaveduck(text)
        : parseGeneric(text);
  r.formatLabel = IMPORT_FORMATS[r.format];
  r.filename = String(filename || "");
  r.stem = r.filename.replace(/\.[^.]+$/, "");
  if (!r.title) r.title = niceTitle(r.stem, r.character);
  r.stats = importStats(r.turns);
  return r;
}

function stripHudParas(paras) {
  return linesToParas(paras.join("\n\n").replace(HUD_RE, "").split("\n"));
}

/* 파싱 결과 + 이름/시작 번호 → 저장용 turns (serializeDoc이 받는 모양) */
function materializeImport(parsed, opt) {
  opt = opt || {};
  var persona = (opt.persona || "").trim() || "나";
  var character = (opt.character || "").trim() || "캐릭터";
  var n = opt.startNo || 1;
  var out = [];
  parsed.turns.forEach(function (t) {
    var no = t.no;
    if (no === null && t.seq) no = n++;
    var blocks = [];
    t.blocks.forEach(function (b) {
      var paras = b.paras;
      if (opt.stripHud) paras = stripHudParas(paras);
      paras = paras.map(guardPara).filter(function (p) { return p.trim(); });
      if (!paras.length) return;
      var sp = b.role === "user" ? persona : (b.role === "char" ? character : (b.name || null));
      blocks.push({ speaker: sp, paras: paras });
    });
    if (blocks.length) out.push({ no: no, label: no === null ? (t.label || "기록") : null, blocks: blocks, seq: !!(t.seq) });
  });
  return out;
}

/* ---------------- 이어붙이기 계획: 이미 저장된 턴은 건너뛰고 새 턴만 ----------------
   같은 채팅을 통째로 다시 올려도(1~50턴 동일 + 51턴 추가) 51턴 하나만 들어가도록,
   턴을 "내용"으로 비교한다. 화자 이름은 비교에서 뺀다(기록마다 이름을 다르게 붙였을 수 있음).
   - 번호 없는 형식(Caveduck·타임스탬프): 파일의 어느 턴이 기존 몇 턴과 같은지 찾아 번호를 맞춘다.
   - 번호 같고 내용 같음 → 건너뜀
   - 번호 같고, 기존 턴이 파일 턴의 앞부분과 정확히 일치(답변이 더 붙은 경우) → 파일 것으로 보강
   - 번호 같고 내용 다름 → conflict 정책: keep(기존 유지, 기본) / replace(파일 내용으로 바꿈)
   ---------------------------------------------------------------------------- */
function blockPrints(t) {
  return t.blocks.map(function (b) {
    return b.paras.join("\n").replace(HUD_RE, "").replace(/\u200B/g, "").replace(/[\s\u00A0]+/g, " ").trim();
  }).filter(function (s) { return s; });
}
function turnFingerprint(t) { return blockPrints(t).join("\u0001"); }

function planAppend(oldTurns, incoming, opt) {
  opt = opt || {};
  var replacePolicy = opt.conflict === "replace";
  var lockBelow = (opt.lockBelow === undefined || opt.lockBelow === null) ? null : opt.lockBelow;  // 분기 기록: 원본에서 물려받은 턴(no < lockBelow)은 절대 바꾸지 않음
  var oldByNo = new Map(), oldFpNo = new Map(), oldUnnum = new Set();
  var turnMax = null;
  oldTurns.forEach(function (t) {
    var fp = turnFingerprint(t);
    if (t.no !== null) {
      oldByNo.set(t.no, t);
      if (fp && !oldFpNo.has(fp)) oldFpNo.set(fp, t.no);
      turnMax = turnMax === null ? t.no : Math.max(turnMax, t.no);
    } else {
      oldUnnum.add(fp);
    }
  });

  /* 번호 없는 형식: 처음으로 기존 턴과 내용이 같은 파일 턴을 찾아 오프셋을 정한다.
     하나도 없으면 전부 새 내용 → 기존 마지막 턴 다음부터 */
  var offset = null, seqStart = null;
  incoming.forEach(function (t) {
    if (!t.seq || t.no === null) return;
    if (seqStart === null || t.no < seqStart) seqStart = t.no;
    if (offset !== null) return;
    var fp = turnFingerprint(t);
    var n = fp ? oldFpNo.get(fp) : undefined;
    if (n !== undefined) offset = n - t.no;
  });
  if (offset === null) offset = (turnMax === null ? 0 : turnMax) + 1 - (seqStart === null ? 1 : seqStart);

  var out = oldTurns.slice();
  var r = { merged: [], added: [], skipped: [], conflicts: [], replaced: [], extended: [],
    introAdded: 0, introSkipped: 0, addedTurns: [], offset: offset, changed: false };

  incoming.forEach(function (t) {
    if (t.no === null) {
      if (oldUnnum.has(turnFingerprint(t))) { r.introSkipped++; return; }
      var nu = { no: null, label: t.label, blocks: t.blocks };
      out.push(nu); r.introAdded++; r.addedTurns.push(nu);
      return;
    }
    var no = t.seq ? t.no + offset : t.no;
    var nt = { no: no, label: null, blocks: t.blocks };
    var old = oldByNo.get(no);
    if (!old) {
      if (lockBelow !== null && no < lockBelow) { r.conflicts.push(no); return; }   // 원본 영역엔 새 턴을 끼워넣지 않음
      out.push(nt); oldByNo.set(no, nt); r.added.push(no); r.addedTurns.push(nt);
      return;
    }
    var ob = blockPrints(old), nb = blockPrints(nt);
    var same = ob.length === nb.length && ob.every(function (s, i) { return s === nb[i]; });
    if (same) { r.skipped.push(no); return; }
    var locked = lockBelow !== null && no < lockBelow;
    var extend = !locked && ob.length > 0 && ob.length < nb.length && ob.every(function (s, i) { return s === nb[i]; });
    if (extend || (replacePolicy && !locked)) {
      out[out.indexOf(old)] = nt; oldByNo.set(no, nt);
      (extend ? r.extended : r.replaced).push(no); r.addedTurns.push(nt);
      return;
    }
    r.conflicts.push(no);
  });

  var numbered = out.filter(function (t) { return t.no !== null; });
  var unnum = out.filter(function (t) { return t.no === null; });
  numbered.sort(function (a, b) { return a.no - b.no; });
  r.merged = unnum.concat(numbered);
  r.changed = !!(r.added.length || r.replaced.length || r.extended.length || r.introAdded);
  return r;
}

/* ---------------- 업로드 분류: 이어붙이기 / 분기 / 재생성 / 수정 / 같음 / 무관 ----------------
   plan은 conflict:"keep"으로 만든 것. 파일의 턴을 번호순으로 보면서
   - 앞부분이 기존과 같고(prefix), 그 뒤가 전부 새 턴          → append
   - 앞부분이 같고, 어느 턴(k)부터 끝까지 기존과 전부 다름     → branch(k)
     · 다만 다른 턴이 기존 기록의 마지막 한 턴뿐이면            → regen(k) (답변 재생성으로 보고 교체 제안)
   - 같은 턴과 다른 턴이 섞여 있음(중간 수정)                   → edits
   - 전부 같음                                                  → same
   - 겹치는 턴이 하나도 없음                                     → none
   ---------------------------------------------------------------------------- */
function classifyPlan(plan, incoming, existingMax) {
  var inS = {}, inE = {}, inA = {}, inC = {};
  plan.skipped.forEach(function (n) { inS[n] = 1; });
  plan.extended.forEach(function (n) { inE[n] = 1; });
  plan.added.forEach(function (n) { inA[n] = 1; });
  plan.conflicts.forEach(function (n) { inC[n] = 1; });
  var targets = [];
  incoming.forEach(function (t) {
    if (t.no === null) return;
    targets.push(t.seq ? t.no + plan.offset : t.no);
  });
  targets.sort(function (a, b) { return a - b; });

async function gh(pathname, opts) {

}

/* ---------------- 분기 (branch_of / branch_at) ----------------
   분기 기록은 갈라진 턴(branch_at)부터 자기 턴만 갖고, 앞부분은 원본 기록에서 가져와 이어 붙인다. */
function parentOf(d) {
  if (!d || !d.branchOf) return null;
  var found = null;
  S.index.forEach(function (x) { if (!found && C.baseId(x.id) === d.branchOf) found = x; });
  return found;
}
function childrenOf(d) {
  var base = C.baseId(d.id), kids = [];
  S.index.forEach(function (x) { if (x.branchOf === base && x !== d) kids.push(x); });
  kids.sort(function (a, b) { return (a.branchAt || 0) - (b.branchAt || 0) || (a.mtime || 0) - (b.mtime || 0); });
  return kids;
}
/* 원본에서 물려받는 앞부분(inh: true 표시) + 자기 턴. 순환 참조는 끊는다 */
function inheritedTurns(d, seen) {
  seen = seen || {};
  if (!d || d.branchAt === null || d.branchAt === undefined || seen[d.id]) return [];
  seen[d.id] = 1;
  var parent = parentOf(d);
  if (!parent) return [];
  var at = d.branchAt;
  return assembleFull(parent, seen).filter(function (t) { return t.no === null || t.no < at; })
    .map(function (t) { return { no: t.no, label: t.label, blocks: t.blocks, inh: true }; });
}
function assembleFull(d, seen) {
  var own = d.turns.map(function (t) { return { no: t.no, label: t.label, blocks: t.blocks, inh: false }; });
  if (d.branchAt === null || d.branchAt === undefined) return own;
  var inh = inheritedTurns(d, seen);
  var numbered = inh.concat(own).filter(function (t) { return t.no !== null; });
  var unnum = inh.concat(own).filter(function (t) { return t.no === null; });
  numbered.sort(function (a, b) { return a.no - b.no; });
  return unnum.concat(numbered);
}
function turnMaxOf(turns) {
  var m = null;
  turns.forEach(function (t) { if (t.no !== null) m = m === null ? t.no : Math.max(m, t.no); });
  return m;
}

/* ---- 파일 백업 저장: 파서가 만든 turns를 그대로 저장 (붙여넣기 재파싱을 거치지 않는다) ---- */
async function saveImportedNew(meta, turns) {
  if (!turns.length) throw UErr("저장할 대화를 찾지 못했어요.");
  var title = (meta.title || "").trim();
  if (!title) throw UErr("제목을 입력해 주세요.");
  var folder = C.cleanFolder(meta.folder || "");
  var m = {
    title: title,
    character: (meta.character || "").trim(),
    persona: (meta.persona || "").trim(),
    date: (meta.date || "").trim() || todayISO(),
    tags: C.normalizeTags(meta.tags || ""),
    source: meta.source || "file",
    branch_of: meta.branch_of || "",
    branch_at: meta.branch_at ? String(meta.branch_at) : "",
  };
  var id = newDocId(title, folder);
  var content = C.serializeDoc(m, turns);
  var sha = await putFile("data/" + id + ".md", content, { message: (m.branch_of ? "분기 저장: " : "파일 백업: ") + title });
  applyLocal(id, content, sha);
  return id;
}

/* 이어붙이기: 항상 GitHub의 최신본을 기준으로 이름표를 정하고, 이미 있는 턴은 건너뛴다.
   분기 기록이면 원본 앞부분까지 이어 붙인 전체와 비교하되, 원본 영역은 건드리지 않고 자기 턴만 쓴다.
   돌려주는 값: { id, plan, wrote } — 새 내용이 없으면 GitHub에 쓰지 않는다 */
async function saveImportedAppend(appendId, parsed, opt) {
  opt = opt || {};
  var latest = await refreshOne(appendId);
  if (!latest) throw UErr("이어붙일 기록을 찾을 수 없어요.");
  var text = latest.text.replace(/\r\n/g, "\n");
  var cur = C.docFromText(appendId, text, { sha: latest.sha });
  var meta = cur.meta;
  var full = assembleFull(cur);
  var turns = C.materializeImport(parsed, {
    character: meta.character, persona: meta.persona, startNo: 1, stripHud: !!opt.stripHud,
  });
  if (!turns.length) throw UErr("저장할 대화를 찾지 못했어요.");
  var plan = C.planAppend(full, turns, { conflict: opt.conflict, lockBelow: cur.branchAt });
  if (!plan.changed) return { id: appendId, plan: plan, wrote: false };
  var own = plan.merged.filter(function (t) { return !t.inh; });
  var content = C.serializeDoc(meta, own);
  var sha = await putFile("data/" + appendId + ".md", content,
    { sha: latest.sha, message: "파일 이어붙임: " + (meta.title || appendId) });
  applyLocal(appendId, content, sha);
  return { id: appendId, plan: plan, wrote: true };
}

/* 분기로 저장: 원본(parentId)의 at턴부터 갈라진 새 기록을 만든다. 파일의 at턴 이후만 저장. */
async function saveImportedBranch(parentId, parsed, opt) {
  opt = opt || {};
  var latest = await refreshOne(parentId);
  if (!latest) throw UErr("원본 기록을 찾을 수 없어요.");
  var parent = C.docFromText(parentId, latest.text.replace(/\r\n/g, "\n"), { sha: latest.sha });
  var full = assembleFull(parent);
  var turns = C.materializeImport(parsed, {
    character: parent.meta.character, persona: parent.meta.persona, startNo: 1, stripHud: !!opt.stripHud,
  });
  var plan = C.planAppend(full, turns, { conflict: "keep" });
  var cls = C.classifyPlan(plan, turns, turnMaxOf(full));
  var at = opt.at || cls.at;
  if (!at) throw UErr("어디서 갈라지는지 찾지 못했어요. 원본과 다른 턴이 없어요.");
  var own = [];
  turns.forEach(function (t) {
    if (t.no === null) return;                         // 시작 메시지는 원본 것
    var no = t.seq ? t.no + plan.offset : t.no;
    if (no >= at) own.push({ no: no, label: null, blocks: t.blocks });
  });
  if (!own.length) throw UErr("분기로 저장할 턴이 없어요.");
  var title = (opt.title || "").trim() || ((parent.meta.title || "기록") + " · " + at + "턴 분기");
  var id = await saveImportedNew({
    title: title, character: parent.meta.character, persona: parent.meta.persona,
    date: opt.date || "", folder: parent.folder, tags: opt.tags || "",
    source: "file:" + parsed.format, branch_of: C.baseId(parentId), branch_at: at,
  }, own);
  return { id: id, at: at, count: own.length, plan: plan };
}

/* 통파일 업로드 자동 분류: 모든 기록과 내용을 비교해 가장 많이 겹치는 기록을 찾고,
   이어붙이기인지 분기인지 정한다. 결과: { doc, plan, cls } 또는 doc=null */
function analyzeUpload(parsed, stripHud) {
  var best = null;
  S.index.forEach(function (d) {
    if (parsed.character && (d.meta.character || "").trim() && (d.meta.character || "").trim() !== parsed.character.trim()) return;
    var full = assembleFull(d);
    var turns = C.materializeImport(parsed, {
      character: d.meta.character, persona: d.meta.persona, startNo: 1, stripHud: !!stripHud,
    });
    if (!turns.length) return;
    var plan = C.planAppend(full, turns, { conflict: "keep", lockBelow: d.branchAt });
    var cls = C.classifyPlan(plan, turns, turnMaxOf(full));
    if (cls.kind === "none") return;
    var score = plan.skipped.length + plan.extended.length;
    var isRoot = d.branchAt === null || d.branchAt === undefined;
    if (!best || score > best.score ||
        (score === best.score && ((isRoot && !best.isRoot) || (isRoot === best.isRoot && (d.mtime || 0) > (best.doc.mtime || 0))))) {
      best = { doc: d, plan: plan, cls: cls, score: score, isRoot: isRoot, turns: turns };
    }
  });
  if (best) return best;
  /* 내용이 겹치는 기록이 없으면 같은 제목의 기록에 이어붙이기 (뒷부분만 따로 내보낸 파일) */
  var title = (parsed.title || "").trim(), chr = (parsed.character || "").trim(), byTitle = null;
  if (title) S.index.forEach(function (d) {
    if ((d.meta.title || "").trim() !== title) return;
    if (chr && (d.meta.character || "").trim() !== chr) return;
    if (!byTitle || (d.mtime || 0) > (byTitle.mtime || 0)) byTitle = d;
  });
  if (!byTitle) return null;
  var full2 = assembleFull(byTitle);
  var turns2 = C.materializeImport(parsed, { character: byTitle.meta.character, persona: byTitle.meta.persona, startNo: 1, stripHud: !!stripHud });
  var plan2 = C.planAppend(full2, turns2, { conflict: "keep", lockBelow: byTitle.branchAt });
  return { doc: byTitle, plan: plan2, cls: C.classifyPlan(plan2, turns2, turnMaxOf(full2)), score: 0, isRoot: true, turns: turns2, byTitle: true };
}

async function updateDoc(id, raw, newFolder) {
  raw = String(raw).replace(/\r\n/g, "\n");
  var meta = C.parseFrontmatter(raw)[0];
  if (!meta.title) throw UErr("맨 위 --- 사이에 title: 이 있어야 해요.");
  var d = S.index.get(id);
  if (!d) throw UErr("기록을 찾을 수 없어요.");
  newFolder = C.cleanFolder(newFolder || "");
  var curFolder = d.folder || "";
  if (newFolder === curFolder) {
    var sha = await putFile("data/" + id + ".md", raw, { sha: d.sha, message: "수정: " + (meta.title || id) });
    applyLocal(id, raw, sha);
    return id;
  }
  // 폴더 이동: 새 위치 생성 → 원본 삭제
  var base = id.split("/").pop();
  var prefix = newFolder ? newFolder + "/" : "";
  var newId = prefix + base, n = 2;
  while (S.index.has(newId) && newId !== id) { newId = prefix + base + "-" + n; n++; }
  var sha2 = await putFile("data/" + newId + ".md", raw, { message: "이동: " + id + " → " + newId });
  try {
    await delFile("data/" + id + ".md", d.sha, "이동(원본 삭제): " + id);
  } catch (e) {
    applyLocal(newId, raw, sha2);
    throw UErr("새 위치에는 저장됐지만 원본 삭제에 실패했어요. ↻ 동기화 후 원본을 직접 삭제해 주세요. (" + friendlyErr(e) + ")");
  }
  removeLocal(id);
  applyLocal(newId, raw, sha2);
  return newId;
}

async function deleteDoc(id) {
  var d = S.index.get(id);
  if (!d) throw UErr("기록을 찾을 수 없어요.");
  await delFile("data/" + id + ".md", d.sha, "삭제: " + id);
  removeLocal(id);
}

/* 삭제 확인창 — 편집 화면과 목록 화면이 같이 씀. withTitle이면 어떤 기록인지 제목을 함께 보여준다. */
function confirmDelete(d, withTitle) {
  var kids = childrenOf(d);
  var warn = kids.length
    ? "\n\n주의: 이 기록에서 갈라진 분기 " + kids.length + "개가 앞부분을 여기서 가져와요. 삭제하면 분기는 갈라진 턴부터만 남습니다."
    : "";
  var head = withTitle ? "「" + (d.meta.title || d.id) + "」 기록을" : "이 기록을";
  return confirm(head + " 완전히 삭제할까요? 되돌릴 수 없어요." + warn);
}

/* ---------------- 라우터 / 레이아웃 ---------------- */
function parseRoute() {
  var h = location.hash || "#/";
  if (h[0] === "#") h = h.slice(1);
  if (h[0] !== "/") h = "/" + h;
  var qi = h.indexOf("?");
  return {
    path: qi < 0 ? h : h.slice(0, qi),
    params: new URLSearchParams(qi < 0 ? "" : h.slice(qi + 1)),
  };
}
function go(h) {
  if (h[0] !== "#") h = "#" + h;
  if (location.hash === h) render();
  else location.hash = h;
}
function qs(obj) {
  var u = new URLSearchParams();
  Object.keys(obj).forEach(function (k) { if (obj[k]) u.set(k, obj[k]); });
  var s = u.toString();
  return s ? "?" + s : "";
}

var LAST_LAYOUT_HASH = null;
function layout(title, bodyHtml, topExtra) {
  document.title = title + " · " + APP_NAME;
  $("topbar-extra").innerHTML = topExtra || "";
  $("app").innerHTML = bodyHtml;
  // 같은 화면을 다시 그리는 경우(백그라운드 동기화 등)에는 스크롤을 건드리지 않는다
  if (LAST_LAYOUT_HASH !== location.hash) {
    window.scrollTo(0, 0);
    LAST_LAYOUT_HASH = location.hash;
  }
}

function loadingScreen() {
  layout("서재",
    '<div class="empty" style="margin-top:60px"><b>GitHub에서 서재를 불러오는 중…</b>' +
    '<span id="sync-note">' + (S.progress ? ("파일 " + S.progress.done + "/" + S.progress.total + " 내려받는 중…") : "목록을 확인하고 있어요") + "</span></div>",
    '<a class="btn small" href="#/settings" title="설정">⚙</a>');
}
function errorScreen() {
  layout("연결 실패",
    '<div class="empty" style="margin-top:60px"><b>서재를 불러오지 못했어요</b>' +
    "<span>" + esc(S.err || "") + "</span></div>" +
    '<p style="text-align:center"><button class="btn" id="btn-retry">다시 시도</button> ' +
    '<a class="btn" href="#/settings">설정 확인</a></p>', "");
  $("btn-retry").addEventListener("click", function () { syncIndex(true); loadingScreen(); });
}

/* ---------------- 페이지: 서재 (목록) ---------------- */
function pageList(params) {
  if (!S.index.size && (S.syncing || !S.loaded)) {
    if (!S.syncing && !S.loaded && S.err) { errorScreen(); return; }
    loadingScreen(); return;
  }
  if (!S.index.size && !S.loaded && S.err) { errorScreen(); return; }

  var q = params.get("q") || "";
  var who = params.get("who") || "";
  var tag = params.get("tag") || "";
  var folder = params.get("folder") || "";
  var index = S.index;
  var inFolder = !!folder;
  var scoped = index;
  if (inFolder) {
    scoped = new Map();
    index.forEach(function (d, i) { if (d.folder === folder) scoped.set(i, d); });
  }
  var searching = !!(q || who || tag);
  var rows = C.searchDocs(index, q, who, tag, inFolder ? folder : "");

  function chip(label, key, val, cur, count) {
    var keep = { q: q, who: who, tag: tag, folder: folder };
    keep[key] = (cur === val) ? "" : val;
    var on = cur === val ? " on" : "";
    var n = count ? '<span class="n">' + count + "</span>" : "";
    return '<a class="chip' + on + '" href="#/' + qs(keep) + '">' + esc(label) + n + "</a>";
  }

  var chips = [];
  C.allCharacters(scoped).forEach(function (kv) { chips.push(chip(kv[0], "who", kv[0], who, kv[1])); });
  C.allTags(scoped).forEach(function (kv) { chips.push(chip("#" + kv[0], "tag", kv[0], tag, kv[1])); });
  var chipsHtml = chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "";

  /* 서가(폴더) 안에서는 목록에서 바로 삭제할 수 있게 각 행에 버튼을 붙인다.
     <a> 안에 <button>을 넣으면 링크 이동이 같이 일어나므로 .docrow 래퍼 옆에 따로 둔다. */
  var showDel = inFolder;
  function delBtn(id) {
    return showDel
      ? '<button class="doc-del" type="button" data-id="' + esc(id) + '" title="이 기록 삭제">삭제</button>'
      : "";
  }
  var rowCls = "docrow" + (showDel ? " has-del" : "");

  function branchRows(d, depth) {
    var kids = childrenOf(d);
    if (!kids.length) return "";
    return kids.map(function (k) {
      return '<div class="' + rowCls + ' sub" style="margin-left:' + (18 * depth) + 'px">' +
        '<a class="doc sub" href="#/view?id=' + encodeURIComponent(k.id) + "&t=" + k.branchAt + '">' +
        '<span class="arrow">↳</span> <b>' + k.branchAt + "턴부터</b> " + esc(k.meta.title || k.id) +
        '<span class="submeta">' + (k.turn_max !== null ? "~" + k.turn_max + "턴 · " : "") + k.n_turns + "개 · " + C.fmtNum(k.chars) + "자" +
        (k.meta.date ? " · " + esc(k.meta.date) : "") + "</span></a>" + delBtn(k.id) + "</div>" +
        branchRows(k, depth + 1);
    }).join("");
  }
  function docRow(row, showFolder) {
    var d = row.d, meta = d.meta;
    var title = meta.title || row.id;
    var snip = q ? C.makeSnippet(d.body, q, row.pos) : C.makeSnippet(d.body, "", -1);
    var fb = (showFolder && d.folder) ? '<span class="fold">' + esc(d.folder) + "</span>" : "";
    var parent = parentOf(d);
    var pb = parent ? '<span class="fold branch">↳ 「' + esc(parent.meta.title || parent.id) + "」 " + d.branchAt + "턴 분기</span>" : "";
    return '<div class="' + rowCls + '">' +
      '<a class="doc" href="#/view?id=' + encodeURIComponent(row.id) + (parent ? "&t=" + d.branchAt : "") + '">' +
      "<h3>" + esc(title) + "</h3>" +
      '<div class="meta">' + fb + pb + C.metaLine(meta, d) + "</div>" +
      '<div class="snip">' + snip + "</div></a>" + delBtn(row.id) + "</div>" +
      branchRows(d, 1);
  }

  var parts = [];

  if (S.offline) {
    parts.push('<div class="notice warn">연결에 실패해서 이 기기에 저장된 마지막 캐시를 보여주고 있어요. (' + esc(S.err || "") + ")</div>");
  }
  if (S.repoPrivate === false) {
    parts.push('<div class="notice warn">⚠ 데이터 저장소가 공개(public) 상태예요 — 누구나 읽을 수 있습니다. GitHub 저장소 설정에서 Private으로 바꿔 주세요.</div>');
  }

  if (inFolder) {
    var nDocs = scoped.size, nChars = 0;
    scoped.forEach(function (d) { nChars += d.chars; });
    parts.push('<div class="folder-head"><h1>' + esc(folder) + "</h1>" +
      '<div class="fmeta">' + nDocs + "개 기록 · 약 " + C.fmtNum(nChars) + '자 · <a href="#/">← 서재 전체</a>' +
      galLinkHtml([folder], true) + "</div></div>");
  }

  var ph = inFolder ? ("「" + folder + "」 서가에서 검색") : "본문·제목·태그에서 검색 (예: 리본, 응접실…)";
  parts.push('<form class="searchbar" id="search-form">' +
    '<input type="text" id="search-q" value="' + esc(q) + '" placeholder="' + esc(ph) + '">' +
    '<button class="btn" type="submit">검색</button></form>');
  if (q && inFolder) {
    parts.push('<p class="count">「' + esc(folder) + '」 서가 안에서 찾고 있어요 · ' +
      '<a href="#/' + qs({ q: q }) + '">서재 전체에서 찾기</a></p>');
  }

  parts.push(chipsHtml);

  var foldList = C.allFolders(index);
  var sectionTitle = "";
  if (!inFolder && !searching && foldList.length) {
    var cards = foldList.map(function (kv) {
      var gf = galFolderNamed(kv[0]);
      return '<a class="folder" href="#/' + qs({ folder: kv[0] }) + '"><div class="fname">' + esc(kv[0]) + "</div>" +
        '<div class="fmeta">' + kv[1].count + "개 · 약 " + C.fmtNum(kv[1].chars) + "자" +
        (gf ? " · 이미지 " + gf.items.length + "장" : "") + "</div></a>";
    });
    parts.push('<h2 class="shelf-h">서가</h2><div class="folders">' + cards.join("") + "</div>");
    rows = rows.filter(function (r) { return !r.d.folder; });
    sectionTitle = "미분류";
  }

  var shown = {};
  rows.forEach(function (r) { shown[C.baseId(r.id)] = 1; });
  var nested = rows.filter(function (r) { return r.d.branchOf && shown[r.d.branchOf]; });
  rows = rows.filter(function (r) { return !(r.d.branchOf && shown[r.d.branchOf]); });
  var docsHtml = rows.map(function (r) { return docRow(r, !inFolder); });

  if (docsHtml.length) {
    var totalChars = 0;
    rows.forEach(function (r) { totalChars += r.d.chars; });
    nested.forEach(function (r) { totalChars += r.d.chars; });
    var label = rows.length + "개 기록" + (nested.length ? " (분기 " + nested.length + "개)" : "") + " · 약 " + C.fmtNum(totalChars) + "자";
    if (sectionTitle) {
      parts.push('<h2 class="shelf-h">' + sectionTitle + ' <span class="sub">· ' + label + "</span></h2>");
    } else {
      parts.push('<p class="count">' + label + "</p>");
    }
    parts.push(docsHtml.join(""));
  } else {
    if (searching) {
      parts.push('<div class="empty"><b>조건에 맞는 기록이 없어요</b>검색어나 필터를 바꿔보세요.</div>');
    } else if (inFolder) {
      parts.push('<div class="empty"><b>이 서가는 아직 비어 있어요</b>새 기록을 저장할 때 이 폴더를 지정하면 여기에 꽂힙니다.</div>');
    } else if (!foldList.length) {
