  show(i);
}

/* ---------------- 올리기 / 지우기 / zip ---------------- */
async function shrinkToWebp(file) {
  if (!/^image\/(png|jpeg)$/.test(file.type)) return null;
  try {
    var bmp = await createImageBitmap(file);
    var s = Math.min(1, UP_MAX / Math.max(bmp.width, bmp.height));
    var cw = Math.max(1, Math.round(bmp.width * s)), ch = Math.max(1, Math.round(bmp.height * s));
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    cv.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
    bmp.close();
    var out = await new Promise(function (res) { cv.toBlob(res, "image/webp", 0.85); });
    if (!out || out.type !== "image/webp" || out.size >= file.size * 0.9) return null;   // 이득이 없으면 원본 그대로
    return out;
  } catch (e) { return null; }
}
function safeFileName(name) {
  return String(name || "image").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/^\.+/, "").trim() || "image";
}
function cleanGalFolder(name) {
  name = String(name || "").trim().replace(/[\\/:*?"<>|\u0000-\u001f]/g, "");
  name = name.replace(/^[ .]+|[ .]+$/g, "");
  return name.slice(0, 60);
}

/* 한 장 올리기 → 저장된 item, 이미 같은 경로가 있으면 "exists" */
async function uploadOne(file, folder, toWebp) {
  var ic = imgCfg();
  var blob = file, name = safeFileName(file.name);
  if (toWebp) {
    var w = await shrinkToWebp(file);
    if (w) { blob = w; name = name.replace(/\.[^.]+$/, "") + ".webp"; }
  }
  var path = folder ? folder + "/" + name : name;
  if (G.items.some(function (it) { return it.path === path; })) return "exists";
  if (blob.size > 50 * 1048576) throw UErr("50MB보다 큰 파일은 올릴 수 없어요");
  var bytes = new Uint8Array(await blob.arrayBuffer());
  var body = { message: "이미지 추가: " + path, content: b64encBytes(bytes) };
  if (G.branch) body.branch = G.branch;
  var r = await gh("/repos/" + ic.repo + "/contents/" + encPath(path), { method: "PUT", token: ic.token, body: body });
  var item = itemFromPath(path, r.content.sha, r.content.size || bytes.length);
  G.items = G.items.filter(function (it) { return it.path !== path; });
  G.items.push(item);
  sortItems(G.items);
  G.loaded = true;
  saveGalCache();
  // 방금 올린 건 다시 내려받을 필요 없이 캐시에 바로
  var typed = new Blob([bytes], { type: mimeOf(name) });
  var c = await galStore();
  if (c) {
    try {
      await c.put(cacheReq("full", item.sha), new Response(typed));
      await c.put(cacheReq("thumb", item.sha), new Response(await makeThumb(typed)));
    } catch (e) {}
  }
  return item;
}

async function deleteImage(item) {
  var ic = imgCfg();
  var body = { message: "이미지 삭제: " + item.path, sha: item.sha };
  if (G.branch) body.branch = G.branch;
  await gh("/repos/" + ic.repo + "/contents/" + encPath(item.path), { method: "DELETE", token: ic.token, body: body });
  G.items = G.items.filter(function (x) { return x.path !== item.path; });
  saveGalCache();
  if (!G.items.some(function (x) { return x.sha === item.sha; })) {
    var c = await galStore();
    if (c) { try { await c.delete(cacheReq("full", item.sha)); await c.delete(cacheReq("thumb", item.sha)); } catch (e) {} }
  }
}

async function zipGallery(list, zipName, btn) {
  if (!list.length || G.busy) return;
  var total = 0;
  list.forEach(function (it) { total += it.size; });
  if (total > 400 * 1048576 && !confirm("총 " + fmtBytes(total) + "예요. zip을 만드는 동안 브라우저 메모리를 그만큼 씁니다. 계속할까요?")) return;
  var orig = btn.textContent;
  btn.disabled = true; G.busy = true;
  var files = new Array(list.length), done = 0, idx = 0, failed = 0;
  async function worker() {
    while (idx < list.length) {
      var k = idx++, it = list[k];
      try {
        var b = await getFull(it);
        files[k] = { name: it.path, data: new Uint8Array(await b.arrayBuffer()) };
      } catch (e) { failed++; }
      done++;
      btn.textContent = done + "/" + list.length;
    }
  }
  try {
    await Promise.all([worker(), worker(), worker(), worker()]);
    files = files.filter(Boolean);
    if (files.length) downloadBlob(zipName, makeZip(files));
  } finally {
    btn.textContent = orig; btn.disabled = false; G.busy = false;
  }
  if (failed) alert(failed + "장은 받지 못했어요. 잠시 후 다시 시도해 주세요.");
}

/* ---------------- 순서 바꾸기 (폴더 안에서 썸네일 끌어 옮기기) ----------------
   · 브라우저 기본 드래그가 아니라 포인터 이벤트로 직접 옮긴다 → 파일로 떨어져 새로 올라가는 일이 없다
   · 마우스는 그냥 끌면 바로 모드가 켜지고, 터치는 「순서 바꾸기」를 눌러 켠 뒤 끌 수 있다
   · 저장 전까지는 화면에서만 바뀌고, 저장하면 폴더의 .order.json 을 한 번 커밋한다 */
function arrItems() { return Array.prototype.slice.call(ARR.grid.querySelectorAll(".gal-item")); }
function arrNames() { return arrItems().map(function (el) { return el._item.name; }); }
function arrChanged() {
  if (!ARR.on || !ARR.els) return false;
  var now = arrItems();
  return now.some(function (el, i) { return ARR.els[i] !== el; });
}
function arrRefresh() {
  var b = $("gal-arr-save");
  if (b) b.disabled = G.busy || !arrChanged();
}
function enterArrange() {
  if (ARR.on || !ARR.grid) return;
  ARR.on = true;
  ARR.els = arrItems();
  ARR.grid.classList.add("arranging");
  ARR.els.forEach(function (el) { el.setAttribute("tabindex", "0"); });
  var bar = $("gal-arr"), tb = $("gal-tb"), ta = $("gal-tb-arr");
  if (bar) bar.hidden = false;
  if (tb) tb.hidden = true;
  if (ta) ta.hidden = false;
  ARR.onKey = function (e) {
    if (e.key === "Escape") {
      if (ARR.drag) { arrEndDrag(); arrRefresh(); return; }
      cancelArrange();
      return;
    }
    var el = document.activeElement;
    if (!el || !el.classList || !el.classList.contains("gal-item") || !ARR.grid || !ARR.grid.contains(el)) return;
    var items = arrItems(), i = items.indexOf(el), j = i, cols = arrCols(items);
    if (e.key === "ArrowLeft") j = i - 1;
    else if (e.key === "ArrowRight") j = i + 1;
    else if (e.key === "ArrowUp") j = i - cols;
    else if (e.key === "ArrowDown") j = i + cols;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = items.length - 1;
    else return;
    e.preventDefault();
    j = Math.max(0, Math.min(items.length - 1, j));
    if (j === i) return;
    if (j > i) ARR.grid.insertBefore(el, items[j].nextSibling);
    else ARR.grid.insertBefore(el, items[j]);
    try { el.focus({ preventScroll: true }); } catch (err) { el.focus(); }
    el.scrollIntoView({ block: "nearest" });
    arrRefresh();
  };
  document.addEventListener("keydown", ARR.onKey);
  arrRefresh();
}
function arrCols(items) {
  if (!items.length) return 1;
  var top = items[0].getBoundingClientRect().top, n = 0;
  for (var k = 0; k < items.length; k++) {
    if (Math.abs(items[k].getBoundingClientRect().top - top) < 2) n++; else break;
  }
  return n || 1;
}
function exitArrange(revert) {
  if (!ARR.on) return;
  arrEndDrag();
  if (revert && ARR.grid && ARR.els) ARR.els.forEach(function (el) { ARR.grid.appendChild(el); });
  ARR.on = false;
  if (ARR.grid) ARR.grid.classList.remove("arranging");
  (ARR.els || []).forEach(function (el) { el.removeAttribute("tabindex"); });
  ARR.els = null;
  if (ARR.onKey) document.removeEventListener("keydown", ARR.onKey);
  ARR.onKey = null;
  var bar = $("gal-arr"), tb = $("gal-tb"), ta = $("gal-tb-arr"), st = $("gal-arr-st");
  if (bar) bar.hidden = true;
  if (tb) tb.hidden = false;
  if (ta) ta.hidden = true;
  if (st) { st.textContent = ""; st.classList.remove("err"); }
}
function cancelArrange() {
  if (!ARR.on || G.busy) return;
  if (arrChanged() && !confirm("바꾼 순서를 저장하지 않고 되돌릴까요?")) return;
  exitArrange(true);
}
/* 화면을 다시 그릴 때 — 모드/드래그 상태를 전부 버린다 */
function arrReset() {
  if (ARR.onKey) document.removeEventListener("keydown", ARR.onKey);
  arrEndDrag();
  ARR.on = false; ARR.grid = null; ARR.els = null; ARR.fname = null; ARR.onKey = null;
}
async function saveArrange() {
  if (!ARR.on || G.busy || !arrChanged()) return;
  var names = arrNames(), fname = ARR.fname;
  var b = $("gal-arr-save"), c = $("gal-arr-cancel"), st = $("gal-arr-st");
  G.busy = true;
  if (b) b.disabled = true;
  if (c) c.disabled = true;
  if (st) { st.textContent = "저장 중…"; st.classList.remove("err"); }
  try {
    await saveOrder(fname, names);
    G.busy = false;
    G.lastMsg = { html: "「" + esc(folderLabel(fname)) + "」 순서를 저장했어요 (" + names.length + "장)" };
    exitArrange(false);
    render();
  } catch (e) {
    G.busy = false;
    if (st) { st.textContent = galErr(e); st.classList.add("err"); }
    if (c) c.disabled = false;
    arrRefresh();
  }
}
/* 포인터로 끌기 */
function arrBind(grid) {
  grid.addEventListener("pointerdown", function (e) {
    if (G.busy || ARR.drag || !ARR.grid) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    var el = e.target.closest ? e.target.closest(".gal-item") : null;
    if (!el || el.parentNode !== grid) return;
    if (!ARR.on && e.pointerType !== "mouse") return;   // 터치는 스크롤과 겹치니 모드를 켠 뒤에만
    ARR.drag = { el: el, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
      ox: 0, oy: 0, moved: false, ghost: null, raf: 0 };
  });
  grid.addEventListener("pointermove", function (e) {
    var d = ARR.drag;
    if (!d || e.pointerId !== d.id) return;
    d.x = e.clientX; d.y = e.clientY;
    if (!d.moved) {
      if (Math.hypot(d.x - d.x0, d.y - d.y0) < 7) return;
      if (!ARR.on) enterArrange();
      if (!ARR.on) { ARR.drag = null; return; }
      d.moved = true;
      arrStartGhost(d);
      try { d.el.setPointerCapture(d.id); } catch (err) {}
    }
    arrTrack(d);
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    grid.addEventListener(ev, function (e) {
      var d = ARR.drag;
      if (!d || e.pointerId !== d.id) return;
      arrEndDrag();
      arrRefresh();
    });
  });
}
function arrStartGhost(d) {
  var r = d.el.getBoundingClientRect();
  var g = d.el.cloneNode(true);
  g.classList.add("gal-ghost"); g.classList.remove("gthumb");
  g.removeAttribute("tabindex"); g.removeAttribute("title"); g.removeAttribute("data-k");
  g.style.width = r.width + "px"; g.style.height = r.height + "px";
  g.style.left = r.left + "px"; g.style.top = r.top + "px";
  d.ox = d.x0 - r.left; d.oy = d.y0 - r.top;
  document.body.appendChild(g);
  d.ghost = g;
  d.el.classList.add("dragging");
  document.body.classList.add("gal-dragging");
  d.raf = requestAnimationFrame(function tick() {
    if (ARR.drag !== d) return;
    arrAutoScroll(d);
    d.raf = requestAnimationFrame(tick);
  });
}
function arrTrack(d) {
  if (!d.ghost || !ARR.grid) return;
  var grid = ARR.grid;
  d.ghost.style.left = (d.x - d.ox) + "px";
  d.ghost.style.top = (d.y - d.oy) + "px";
  var under = document.elementFromPoint(d.x, d.y);
  var t = under && under.closest ? under.closest(".gal-item") : null;
  if (t && t !== d.el && t.parentNode === grid) {
    var r = t.getBoundingClientRect();
    if (d.x - r.left < r.width / 2) { if (d.el.nextSibling !== t) grid.insertBefore(d.el, t); }
    else { if (t.nextSibling !== d.el) grid.insertBefore(d.el, t.nextSibling); }
  } else if (under === grid) {
    var items = arrItems(), first = items[0], last = items[items.length - 1];
    var fr = first.getBoundingClientRect(), lr = last.getBoundingClientRect();
    if (d.y > lr.bottom || (d.y >= lr.top && d.x > lr.right)) { if (last !== d.el) grid.appendChild(d.el); }
    else if (d.y < fr.top || (d.y <= fr.bottom && d.x < fr.left)) { if (first !== d.el) grid.insertBefore(d.el, first); }
  }
}
function arrAutoScroll(d) {
  if (!d.moved) return;
  var edge = 64, h = window.innerHeight, dy = 0;
  if (d.y < edge) dy = -Math.ceil((edge - d.y) / 4);
  else if (d.y > h - edge) dy = Math.ceil((d.y - (h - edge)) / 4);
  if (dy) { window.scrollBy(0, dy); arrTrack(d); }
}
function arrEndDrag() {
  var d = ARR.drag;
  if (!d) return;
  ARR.drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  if (d.ghost) d.ghost.remove();
  d.el.classList.remove("dragging");
  document.body.classList.remove("gal-dragging");
  try { d.el.releasePointerCapture(d.id); } catch (e) {}
  if (d.moved) { try { d.el.focus({ preventScroll: true }); } catch (e) {} }
}

/* ---------------- 페이지: 갤러리 ---------------- */
function pageGallery(params) {
  var topBase = '<a class="btn small" href="#/">서재로</a><a class="btn small" href="#/settings" title="설정">⚙</a>';

  if (!imgCfgOk()) {
    layout("갤러리",
      '<div class="empty" style="margin-top:40px"><b>이미지 저장소가 아직 연결되지 않았어요</b>' +
      "텍스트와는 따로, 이미지만 넣어둘 <b>비공개</b> 저장소를 하나 만들고 설정에 적어주세요." +
      "<span>저장소 안에서 <code>캐릭터이름/파일.webp</code>처럼 폴더를 나누면 여기서 폴더(캐릭터)별로 모아 볼 수 있어요.</span>" +
      '<p style="margin:18px 0 0"><a class="btn primary" href="#/settings">설정 열기</a></p></div>', topBase);
    return;
  }
  if (!G.loaded) {
    if (G.err && !G.syncing) {
      layout("갤러리",
        '<div class="empty" style="margin-top:60px"><b>이미지 목록을 불러오지 못했어요</b><span>' + esc(G.err) + "</span></div>" +
        '<p style="text-align:center"><button class="btn" id="gal-retry">다시 시도</button> <a class="btn" href="#/settings">설정 확인</a></p>', topBase);
      $("gal-retry").addEventListener("click", function () { syncGallery(true); render(); });
      return;
    }
    layout("갤러리", '<div class="empty" style="margin-top:60px"><b>이미지 목록을 불러오는 중…</b><span>저장소 목록을 한 번만 읽으면 돼요</span></div>', topBase);
    return;
  }

  var folder = params.get("folder");                 // null=폴더 목록, "*"=전체, "~"=미분류, 그 외=폴더 이름
  var folders = galFolders();
  var total = 0;
  G.items.forEach(function (it) { total += it.size; });
  var parts = [];
  if (G.offline) parts.push('<div class="notice warn">연결에 실패해서 이 기기에 저장된 마지막 목록을 보여주고 있어요. (' + esc(G.err || "") + ")</div>");
  if (G.repoPrivate === false) parts.push('<div class="notice warn">⚠ 이미지 저장소가 공개(public) 상태예요 — 누구나 볼 수 있습니다. GitHub 저장소 설정에서 Private으로 바꿔 주세요.</div>');
  if (G.lastMsg) {
    parts.push('<div class="gal-summary' + (G.lastMsg.err ? " err" : "") + '">' + G.lastMsg.html + "</div>");
    G.lastMsg = null;
  }
  var syncBtn = '<button class="btn small" id="gal-sync" title="이미지 저장소와 동기화"' + (G.syncing ? " disabled" : "") + ">" + (G.syncing ? "…" : "↻") + "</button>";

  function chipRow(cur) {
    var chips = ['<a class="chip' + (cur === GAL_ALL ? " on" : "") + '" href="#/gallery?folder=*">전체<span class="n">' + G.items.length + "</span></a>"];
    folders.forEach(function (f) {
      var p = folderParam(f.name);
      chips.push('<a class="chip' + (cur === p ? " on" : "") + '" href="#/gallery' + qs({ folder: p }) + '">' +
        esc(folderLabel(f.name)) + '<span class="n">' + f.items.length + "</span></a>");
    });
    return '<div class="chips">' + chips.join("") + "</div>";
  }

  /* ----- 폴더 목록 (루트) ----- */
  if (folder === null) {
    parts.push('<div class="folder-head"><h1>갤러리</h1><div class="fmeta">' +
      (G.items.length
        ? folders.length + "개 폴더 · " + G.items.length + "장 · " + fmtBytes(total) + ' · <a href="#/gallery?folder=*">전부 한 화면에</a>'
        : "아직 이미지가 없어요") + "</div></div>");
    if (folders.length) {
      var cards = folders.map(function (f, k) {
        return '<a class="folder gal" href="#/gallery' + qs({ folder: folderParam(f.name) }) + '">' +
          '<div class="gcover gthumb" data-k="' + k + '"><img alt="" decoding="async"></div>' +
          '<div class="fname">' + esc(folderLabel(f.name)) + '<span class="n">' + f.items.length + "장</span></div>" +
          '<div class="fmeta">' + fmtBytes(f.size) + (f.name ? shelfNoteText(f.name) : "") + "</div></a>";
      });
      parts.push('<h2 class="shelf-h">폴더 <span class="sub">· 캐릭터별</span></h2><div class="folders">' + cards.join("") + "</div>");
    } else {
      parts.push('<div class="empty"><b>비어 있어요</b>아래에 폴더 이름(캐릭터 이름)을 적어 열고, 그 안에 이미지를 떨어뜨리면 됩니다.' +
        "<span>GitHub 웹에서 직접 폴더를 만들어 올려도 ↻ 동기화하면 똑같이 보여요.</span></div>");
    }
    parts.push('<form class="searchbar" id="gal-newf" style="margin-top:22px"><input type="text" id="gal-newf-name" placeholder="새 폴더 이름 (캐릭터 이름)" maxlength="60">' +
      '<button class="btn" type="submit">폴더 열기</button></form>' +
      '<div class="hint">폴더는 첫 이미지를 올릴 때 저장소에 실제로 만들어져요. 파일 이름은 그대로 두고, 폴더만 캐릭터 이름으로 나누면 됩니다.</div>');

    layout("갤러리", parts.join("\n"),
      syncBtn + '<button class="btn small" id="gal-zip" title="이미지 전부 zip으로 저장"' + (G.items.length ? "" : " disabled") + ">전체 zip</button>" + topBase);

    document.querySelectorAll(".gthumb").forEach(function (el) {
      var f = folders[+el.getAttribute("data-k")];
      if (f && f.items.length) tqObserve(el, f.items[0]);
    });
    $("gal-sync").addEventListener("click", function () { syncGallery(true); render(); });
    $("gal-zip").addEventListener("click", function () { zipGallery(G.items.slice(), "이미지백업-" + todayISO() + ".zip", this); });
    $("gal-newf").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var n = cleanGalFolder($("gal-newf-name").value);
      if (!n) return;
      go("/gallery" + qs({ folder: n }));
    });
    return;
  }

  /* ----- 폴더 안 / 전체 ----- */
  var fname = folder === GAL_ALL ? null : (folder === GAL_ROOT ? "" : folder);
  var list = fname === null ? G.items.slice() : G.items.filter(function (it) { return it.folder === fname; });
  var lsize = 0;
  list.forEach(function (it) { lsize += it.size; });
  var title = fname === null ? "전체" : folderLabel(fname);
  var canUpload = fname !== null && cleanGalFolder(fname) === fname;
  var canArrange = fname !== null && list.length >= 2;   // 순서는 폴더 안에서만 (전체 화면에선 폴더순 고정)

  parts.push('<div class="folder-head"><h1>' + esc(title) + "</h1>" +
    '<div class="fmeta">' + list.length + "장 · " + fmtBytes(lsize) + ' · <a href="#/gallery">← 갤러리 전체</a>' +
    (fname ? shelfLinkHtml(fname) : "") + "</div></div>");
  parts.push(chipRow(folder === GAL_ALL ? GAL_ALL : folderParam(fname)));

  if (canArrange) {
    parts.push('<div class="gal-arr" id="gal-arr" hidden><b>순서 바꾸는 중</b>' +
      "<span>썸네일을 끌어서 원하는 자리에 놓거나, 하나를 고른 뒤 ← → ↑ ↓ 키로 옮겨요. 「순서 저장」을 눌러야 반영돼요.</span>" +
      '<span class="st" id="gal-arr-st"></span></div>');
  }
  if (list.length) {
    parts.push('<div class="gal-grid" id="gal-grid">' + list.map(function (it, k) {
      var cap = fname === null && it.folder ? it.folder + " / " + it.name : it.name;
      return '<div class="gal-item gthumb" data-k="' + k + '" title="' + esc(cap) + '"><img alt="" decoding="async" draggable="false"><div class="gname">' + esc(cap) + "</div></div>";
    }).join("") + "</div>");
  } else {
    parts.push('<div class="empty"><b>' + (fname === null ? "아직 이미지가 없어요" : "이 폴더는 비어 있어요") + "</b>" +
      (canUpload ? "아래에 이미지를 떨어뜨리면 이 폴더로 올라가요." : "") + "</div>");
  }

  if (canUpload) {
    var webpOn = true;
    try { webpOn = localStorage.getItem(LS_GAL_WEBP) !== "0"; } catch (e) {}
    parts.push('<div class="panel gal-up">' +
      '<div class="drop" id="gal-drop" tabindex="0" role="button" aria-label="이미지 올리기">' +
      '<input type="file" id="gal-file" multiple accept="image/*" style="display:none">' +
      "<b>이미지를 여기에 끌어다 놓으면 「" + esc(title) + "」에 올라가요</b>" +
      '<span>또는 <span class="link">파일 선택</span> — 여러 장을 한 번에 올려도 돼요 (한 장씩 차례로 저장돼요)</span></div>' +
      '<label class="chk"><input type="checkbox" id="gal-webp"' + (webpOn ? " checked" : "") + "> PNG·JPG는 WebP로 줄여서 올리기 (긴 변 " + UP_MAX + "px · 화질 85 · 보통 1/3 크기)</label>" +
      '<div class="pv-note" id="gal-msg"></div></div>');
  }

  layout(title, parts.join("\n"),
    '<span class="tb-set" id="gal-tb">' + syncBtn +
    '<button class="btn small" id="gal-zip" title="이 화면의 이미지를 zip으로 저장"' + (list.length ? "" : " disabled") + ">" +
    (fname === null ? "전체 zip" : "이 폴더 zip") + "</button>" +
    (canArrange ? '<button class="btn small" id="gal-arr-btn" title="썸네일을 끌어서 순서를 바꿔요">순서 바꾸기</button>' : "") + "</span>" +
    (canArrange
      ? '<span class="tb-set" id="gal-tb-arr" hidden><button class="btn small primary" id="gal-arr-save" disabled>순서 저장</button>' +
        '<button class="btn small" id="gal-arr-cancel">취소</button></span>'
      : "") +
    topBase);

  document.querySelectorAll(".gal-item.gthumb").forEach(function (el) {
    var k = +el.getAttribute("data-k");
    tqObserve(el, list[k]);
    el.addEventListener("click", function () { if (!ARR.on) openLightbox(list, k); });
  });
  $("gal-sync").addEventListener("click", function () { syncGallery(true); render(); });
  $("gal-zip").addEventListener("click", function () {
    zipGallery(list.slice(), "이미지백업-" + (fname === null ? "전체" : folderLabel(fname)) + "-" + todayISO() + ".zip", this);
  });
  if (canArrange) {
    ARR.grid = $("gal-grid");
    ARR.fname = fname;
    arrBind(ARR.grid);
    $("gal-arr-btn").addEventListener("click", function () {
      enterArrange();
      var first = ARR.grid.querySelector(".gal-item");
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
    });
    $("gal-arr-save").addEventListener("click", saveArrange);
    $("gal-arr-cancel").addEventListener("click", cancelArrange);
  }

  if (!canUpload) { GAL.onFiles = null; return; }

  var drop = $("gal-drop"), input = $("gal-file"), msg = $("gal-msg");
  $("gal-webp").addEventListener("change", function () {
    try { localStorage.setItem(LS_GAL_WEBP, this.checked ? "1" : "0"); } catch (e) {}
  });
  drop.addEventListener("click", function () { if (!G.busy) input.click(); });
  drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!G.busy) input.click(); } });
  input.addEventListener("change", function () { if (input.files.length) GAL.onFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); if (!G.busy) drop.classList.add("over"); });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });

  GAL.onFiles = async function (files) {
    if (G.busy) return;
    var arr = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type) || IMG_EXT.test(f.name); });
    if (!arr.length) { msg.textContent = "이미지 파일이 아니에요."; return; }
    var toWebp = $("gal-webp").checked;
    G.busy = true;
    drop.setAttribute("aria-disabled", "true");
    var ok = 0, saved = 0, skipped = [], failed = [], fatal = false;
    for (var k = 0; k < arr.length; k++) {
      var f = arr[k];
      msg.textContent = (k + 1) + "/" + arr.length + " 올리는 중… " + f.name;
      try {
        var r = await uploadOne(f, fname, toWebp);
        if (r === "exists") skipped.push(f.name);
        else { ok++; saved += r.size; }
      } catch (e) {
        failed.push(f.name + " — " + galErr(e));
        if (e && (e.status === 401 || e.status === 404)) { fatal = true; break; }
      }
    }
    G.busy = false;
    var bits = [];
    if (ok) bits.push("<b>" + ok + "장</b> 올렸어요 (" + fmtBytes(saved) + ")");
    if (skipped.length) bits.push(skipped.length + "장은 같은 이름이 이미 있어서 건너뛰었어요: " + esc(skipped.join(", ")));
    if (failed.length) bits.push(failed.length + "장 실패: " + esc(failed.join(" / ")));
    if (fatal) bits.push("연결 문제로 중단했어요. 설정을 확인한 뒤 나머지를 다시 올려주세요.");
    G.lastMsg = { html: bits.join("<br>"), err: !!failed.length };
    render();
  };
}

/* ---------------- 테마 ---------------- */
function setThemeIcon() {
  var b = $("theme-btn");
  if (b) b.textContent = document.documentElement.dataset.theme === "light" ? "☾" : "☀";
}
function toggleTheme() {
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === "light" ? "dark" : "light";
  try { localStorage.setItem("archive-theme", h.dataset.theme); } catch (e) {}
  setThemeIcon();
}

/* ---------------- 라우팅 진입 ---------------- */
function render() {
  var r = parseRoute();
  var lb = $("lb");
  if (lb) { lb._dirty = false; closeLightbox(); }
  arrReset();
  if (!cfgOk() && r.path !== "/settings") { pageSettings(true); return; }
  if (r.path === "/" || r.path === "") { syncIndex(false); syncGalleryOnce(); pageList(r.params); }
  else if (r.path === "/view") { syncIndex(false); syncGalleryOnce(); pageView(r.params); }
  else if (r.path === "/new") { syncIndex(false); pageNew(r.params); }
  else if (r.path === "/import") { syncIndex(false); pageImport(r.params); }
  else if (r.path === "/edit") { syncIndex(false); pageEdit(r.params); }
  else if (r.path === "/gallery") { syncGallery(false); pageGallery(r.params); }
  else if (r.path === "/settings") { pageSettings(false); }
  else { pageList(new URLSearchParams()); }
}

window.addEventListener("hashchange", render);
document.addEventListener("DOMContentLoaded", function () {
  $("theme-btn").addEventListener("click", toggleTheme);
  setThemeIcon();
  /* 파일 백업 화면에서는 페이지 어디에 떨어뜨려도 받아주고, 브라우저가 파일을 열어버리지 않게 막는다 */
  document.addEventListener("dragover", function (e) { if ($("imp-drop") || $("gal-drop")) e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    var zone = $("imp-drop"), gz = $("gal-drop");
    if (!zone && !gz) return;
    e.preventDefault();
    if ($("lb") || ARR.drag) return;   // 화면 안의 이미지를 끌어 놓은 건 파일 올리기가 아니다
    var files = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length ? e.dataTransfer.files : null;
    if (zone) {
      zone.classList.remove("over");
      if (IMP.onFiles && files) IMP.onFiles(files);
    } else {
      gz.classList.remove("over");
      if (GAL.onFiles && files) GAL.onFiles(files);
    }
  });
  if (cfgOk()) { hydrateFromCache(); hydrateGallery(); }
  render();
});

})();

</script>
</body></html>
