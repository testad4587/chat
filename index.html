  var impHref = "#/import" + (inFolder ? qs({ folder: folder }) : "");
  var top =
    '<button class="btn small" id="btn-sync" title="GitHub와 동기화"' + (S.syncing ? " disabled" : "") + ">" + (S.syncing ? "…" : "↻") + "</button>" +
    '<button class="btn small" id="btn-backup" title="모든 기록을 zip으로 저장">전체 백업</button>' +
    '<a class="btn small" href="#/gallery" title="캐릭터 이미지 갤러리">갤러리</a>' +
    '<a class="btn small" href="' + impHref + '" title="txt 내보내기 파일을 올려 자동으로 저장">파일 백업</a>' +
    '<a class="btn primary small" href="' + newHref + '">＋ 새 기록</a>' +
    '<a class="btn small" href="#/settings" title="설정">⚙</a>';
  layout(folder || "서재", parts.join("\n"), top);

  $("search-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    go("/" + qs({ q: $("search-q").value, who: who, tag: tag, folder: folder }));
  });
  $("btn-sync").addEventListener("click", function () { syncIndex(true); render(); });
  Array.prototype.forEach.call(document.querySelectorAll(".doc-del"), function (btn) {
    btn.addEventListener("click", async function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      var id = btn.getAttribute("data-id");
      var d = S.index.get(id);
      if (!d) return;
      if (!confirmDelete(d, true)) return;
      btn.disabled = true;
      btn.textContent = "삭제 중…";
      try {
        await deleteDoc(id);
        render();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "삭제";
        alert("삭제하지 못했어요.\n" + friendlyErr(e));
      }
    });
  });
  $("btn-backup").addEventListener("click", function () {
    var enc = new TextEncoder();
    var files = [];
    Array.from(S.index.keys()).sort().forEach(function (id) {
      files.push({ name: "data/" + id + ".md", data: enc.encode(S.index.get(id).raw) });
    });
    if (!files.length) return;
    downloadBlob("서고백업-" + todayISO() + ".zip", makeZip(files));
  });
}

/* ---------------- 기록 내 검색 도우미 ---------------- */
function turnTextOf(t) {
  var parts = [];
  t.blocks.forEach(function (b) {
    if (b.speaker) parts.push(b.speaker);
    b.paras.forEach(function (p) { parts.push(p); });
  });
  return parts.join("\n");
}

/* 현재 페이지에 그려진 턴 단위(구분선 + 블록들)를 순서대로 수집 */
function collectTurnGroups() {
  var reader = document.querySelector(".reader");
  var groups = [], cur = null;
  if (!reader) return groups;
  Array.prototype.forEach.call(reader.children, function (el) {
    if (el.classList.contains("turn-mark")) { cur = { mark: el, blocks: [] }; groups.push(cur); }
    else if (cur && el.classList.contains("blk")) cur.blocks.push(el);
  });
  return groups;
}

/* 텍스트 노드를 훑으며 일치 부분을 <mark class="hl">로 감싼다 (대소문자 무시) */
function highlightMatches(rootEl, q, isCur) {
  var lq = q.toLowerCase();
  var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function (node) {
    var text = node.nodeValue;
    var lower = text.toLowerCase();
    var idx = lower.indexOf(lq);
    if (idx < 0) return;
    var frag = document.createDocumentFragment();
    var pos = 0;
    while (idx >= 0) {
      if (idx > pos) frag.appendChild(document.createTextNode(text.slice(pos, idx)));
      var mk = document.createElement("mark");
      mk.className = isCur ? "hl cur" : "hl";
      mk.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(mk);
      pos = idx + q.length;
      idx = lower.indexOf(lq, pos);
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---------------- 페이지: 읽기 ---------------- */
function pageView(params) {
  var id = params.get("id") || "";
  var d = S.index.get(id);
  if (!d) {
    if (S.syncing || !S.loaded) { loadingScreen(); return; }
    layout("없음", '<div class="empty" style="margin-top:40px"><b>기록을 찾을 수 없어요</b></div>',
      '<a class="btn small" href="#/">서재로</a>');
    return;
  }
  var meta = d.meta;
  var persona = (meta.persona || "").trim();
  var character = (meta.character || "").trim();
  var title = meta.title || id;
  var qid = encodeURIComponent(id);

  var parent = parentOf(d);
  var kids = childrenOf(d);
  var isBranch = d.branchAt !== null && d.branchAt !== undefined;
  var turns = assembleFull(d);               // 분기면 원본 앞부분(inh) + 자기 턴
  var total = turns.length;
  var pages = Math.max(1, Math.ceil(total / PAGE_TURNS));
  function pageOfTurn(no) {
    var gi = -1;
    turns.some(function (t, i) { if (t.no === no) { gi = i; return true; } return false; });
    return gi < 0 ? null : Math.floor(gi / PAGE_TURNS) + 1;
  }
  var p = parseInt(params.get("p") || "", 10);
  if (isNaN(p)) {                            // p가 없으면: t가 있으면 그 턴의 쪽, 분기면 갈라진 턴의 쪽
    var tq = parseInt(params.get("t") || "", 10);
    p = (!isNaN(tq) && pageOfTurn(tq)) || (isBranch && pageOfTurn(d.branchAt)) || 1;
  }
  p = Math.min(Math.max(p, 1), pages);
  var chunk = turns.slice((p - 1) * PAGE_TURNS, p * PAGE_TURNS);

  /* 기록 내 텍스트 검색 상태 (URL: q=검색어, qi=몇 번째 일치 턴) */
  var q = (params.get("q") || "").trim();
  var qi = parseInt(params.get("qi") || "0", 10);
  if (isNaN(qi) || qi < 0) qi = 0;
  var hitTurns = [], hitTotal = 0;
  if (q) {
    var lq = q.toLowerCase();
    turns.forEach(function (t, i) {
      var n = C.countOcc(turnTextOf(t).toLowerCase(), lq);
      if (n > 0) { hitTurns.push(i); hitTotal += n; }
    });
    if (qi > hitTurns.length) qi = hitTurns.length;
  }
  var keepQ = q ? "&q=" + encodeURIComponent(q) + (qi ? "&qi=" + qi : "") : "";

  function turnLabel(t) { return t.no !== null ? t.no + "턴" : (t.label || "기록"); }
  function hitUrl(k) {
    var gi = hitTurns[k - 1];
    var pg = Math.floor(gi / PAGE_TURNS) + 1;
    return "/view?id=" + qid + "&p=" + pg + "&q=" + encodeURIComponent(q) + "&qi=" + k;
  }

  var opts = [];
  turns.forEach(function (t, i) {
    if (t.no === null) return;
    var pg = Math.floor(i / PAGE_TURNS) + 1;
    var url = "#/view?id=" + qid + "&p=" + pg + "&t=" + t.no + keepQ;
    opts.push('<option value="' + url + '">' + t.no + "턴</option>");
  });
  var turnSel = opts.length
    ? '<select id="jump"><option value="">턴 이동</option>' + opts.join("") + "</select>"
    : "";

  var top = '<div class="readerbar">' + turnSel +
    '<a class="btn small" href="#/new?append=' + qid + '">이어붙이기</a>' +
    '<button class="btn small" id="btn-branch" title="이 기록의 어느 턴부터 갈라지는 분기를 붙여넣기로 만들어요">분기 만들기</button>' +
    '<a class="btn small" href="#/edit?id=' + qid + '">편집</a>' +
    '<button class="btn small" id="btn-raw">.md</button></div>';

  var foldHtml = d.folder
    ? '<a class="fold" href="#/' + qs({ folder: d.folder }) + '">' + esc(d.folder) + "</a>"
    : "";
  var galFolder = galFolderNamed(d.folder) || galFolderNamed(character);
  var galChip = galFolder
    ? '<a class="fold" href="#/gallery' + qs({ folder: folderParam(galFolder.name) }) + '" title="갤러리에서 보기">' +
      esc(galFolder.name) + " 이미지 " + galFolder.items.length + "장</a>"
    : "";

  var navHtml = "";
  if (pages > 1) {
    var rng = chunk.length ? (turnLabel(chunk[0]) + "~" + turnLabel(chunk[chunk.length - 1])) : "";
    var prevA = p > 1 ? '<a class="btn small" href="#/view?id=' + qid + "&p=" + (p - 1) + keepQ + '">← 이전</a>' : "<span></span>";
    var nextA = p < pages ? '<a class="btn small" href="#/view?id=' + qid + "&p=" + (p + 1) + keepQ + '">다음 →</a>' : "<span></span>";
    navHtml = '<div class="pagenav">' + prevA +
      "<span>" + rng + " · " + p + "/" + pages + "쪽 · 총 " + total + "턴</span>" + nextA + "</div>";
  }

  /* 검색줄: 턴 번호 이동 + 이 기록 안에서 텍스트 검색 */
  var tsForm = d.turn_min !== null
    ? '<form id="ts-form"><input id="ts-no" type="text" inputmode="numeric" autocomplete="off" placeholder="턴 번호">' +
      '<button class="btn small" type="submit">턴 이동</button></form>'
    : "";
  var searchHtml =
    '<div class="docsearch">' + tsForm +
    '<form class="qsf" id="qs-form"><input id="qs-q" type="text" autocomplete="off" placeholder="이 기록에서 검색">' +
    '<button class="btn small" type="submit">찾기</button></form></div>' +
    '<div class="ts-msg" id="ts-msg"></div>';

  /* 검색 중일 때 하단 찾기바 */
  var findHtml = "";
  if (q) {
    var posTxt = hitTurns.length
      ? (qi ? qi + "/" : "") + hitTurns.length + "턴 · " + hitTotal + "회"
      : "일치 없음";
    findHtml = '<div class="findbar"><div class="findbar-in">' +
      "<b>“" + esc(q) + "”</b>" +
      '<span class="pos">' + posTxt + "</span>" +
      '<span class="fsp"></span>' +
      (hitTurns.length
        ? '<button class="btn small" id="f-prev" title="이전 일치 턴">↑</button>' +
          '<button class="btn small" id="f-next" title="다음 일치 턴">↓</button>'
        : "") +
      '<button class="btn small" id="f-clear" title="검색 닫기">✕</button>' +
      "</div></div>";
  }

  /* 분기 이동: 원본에서는 갈라진 턴 아래에 분기 링크, 분기에서는 갈라진 턴에 원본 링크 */
  var links = {};
  kids.forEach(function (k) {
    if (k.branchAt === null) return;
    (links[k.branchAt] = links[k.branchAt] || []).push({
      href: "#/view?id=" + encodeURIComponent(k.id) + "&t=" + k.branchAt,
      label: "여기서 분기 「" + (k.meta.title || k.id) + "」",
      note: k.branchAt + "~" + (k.turn_max !== null ? k.turn_max : k.branchAt) + "턴 · " + k.n_turns + "개",
    });
  });
  var branchNote = "";
  if (isBranch) {
    var pl = parent ? ("「" + esc(parent.meta.title || parent.id) + "」") : "원본";
    var phref = parent ? "#/view?id=" + encodeURIComponent(parent.id) + "&t=" + d.branchAt : "";
    (links[d.branchAt] = links[d.branchAt] || []).unshift({
      href: phref || "#", cls: "up",
      label: "여기부터 이 분기의 내용 — " + (parent ? "원본 " + (parent.meta.title || parent.id) + "의 " + d.branchAt + "턴으로" : "원본 기록을 찾을 수 없어요"),
    });
    branchNote = '<div class="notice branch-note">' + pl + "의 <b>" + d.branchAt + "턴</b>에서 갈라진 분기예요. " +
      (parent ? "앞의 1~" + (d.branchAt - 1) + "턴은 원본 그대로 이어서 보여드려요. " +
        '<a href="' + phref + '">원본에서 보기</a>' : "원본 기록이 없어서 " + d.branchAt + "턴부터만 보여요.") + "</div>";
  } else if (kids.length) {
    branchNote = '<div class="notice branch-note">이 기록에서 갈라진 분기 ' + kids.length + "개: " +
      kids.map(function (k) {
        return '<a href="#/view?id=' + encodeURIComponent(k.id) + "&t=" + k.branchAt + '">' + esc(k.meta.title || k.id) + "</a> (" + k.branchAt + "턴~)";
      }).join(" · ") + "</div>";
  }

  var body =
    '<div class="reader-head"><h1>' + esc(title) + "</h1>" +
    '<div class="meta">' + foldHtml + galChip + C.metaLine(meta, d) + "</div></div>" +
    branchNote +
    searchHtml +
    '<div class="reader">' + navHtml +
    C.renderTurns(chunk, persona, character, { links: links }) +
    navHtml +
    '<hr class="endmark">' +
    '<p class="backline"><a class="btn small" href="#/">← 서재로</a></p></div>' +
    findHtml;
  layout(title, body, top);

  var jump = $("jump");
  if (jump) jump.addEventListener("change", function () { if (this.value) go(this.value); });
  $("btn-raw").addEventListener("click", function () {
    downloadText(id.split("/").pop() + ".md", d.raw);
  });
  $("btn-branch").addEventListener("click", function () {
    var last = d.turn_max !== null ? d.turn_max : (isBranch ? d.branchAt : 1);
    var v = prompt("몇 턴부터 갈라지나요? (그 턴부터 새로 붙여넣게 돼요)", String(last));
    if (v === null) return;
    var no = parseInt(v, 10);
    if (isNaN(no) || no < 1) { alert("턴 번호를 숫자로 적어주세요."); return; }
    go("/new?branch=" + qid + "&at=" + no);
  });

  /* 턴 번호로 이동 */
  var tsF = $("ts-form");
  if (tsF) {
    tsF.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var v = $("ts-no").value.trim();
      if (!v) return;
      var no = parseInt(v, 10);
      var gi = -1;
      if (!isNaN(no)) turns.some(function (t, i) { if (t.no === no) { gi = i; return true; } return false; });
      if (gi < 0) {
        var rng = d.turn_max !== d.turn_min ? d.turn_min + "~" + d.turn_max : String(d.turn_min);
        $("ts-msg").textContent = v + "턴은 이 기록에 없어요 (" + rng + "턴 범위)";
        return;
      }
      go("/view?id=" + qid + "&p=" + (Math.floor(gi / PAGE_TURNS) + 1) + "&t=" + no + keepQ);
    });
    $("ts-no").addEventListener("input", function () { $("ts-msg").textContent = ""; });
  }

  /* 이 기록 안에서 텍스트 검색 */
  $("qs-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = $("qs-q").value.trim();
    if (!v) { if (q) go("/view?id=" + qid + "&p=" + p); return; }
    if (v === q) {
      /* 같은 검색어로 다시 찾기 → 다음 일치 턴으로 */
      if (hitTurns.length) go(hitUrl((qi % hitTurns.length) + 1));
      else $("ts-msg").textContent = "“" + v + "” — 이 기록에서 찾지 못했어요";
      return;
    }
    var lv = v.toLowerCase(), first = -1;
    turns.some(function (t, i) {
      if (turnTextOf(t).toLowerCase().indexOf(lv) >= 0) { first = i; return true; }
      return false;
    });
    if (first < 0) { go("/view?id=" + qid + "&p=" + p + "&q=" + encodeURIComponent(v)); return; }
    go("/view?id=" + qid + "&p=" + (Math.floor(first / PAGE_TURNS) + 1) +
      "&q=" + encodeURIComponent(v) + "&qi=1");
  });
  $("qs-q").addEventListener("input", function () { $("ts-msg").textContent = ""; });

  if (q) {
    $("qs-q").value = q;
    var N = hitTurns.length;
    var fp = $("f-prev"), fn = $("f-next"), fc = $("f-clear");
    if (fp) fp.addEventListener("click", function () { go(hitUrl(((qi - 2 + N) % N) + 1)); });
    if (fn) fn.addEventListener("click", function () { go(hitUrl((qi % N) + 1)); });
    if (fc) fc.addEventListener("click", function () { go("/view?id=" + qid + "&p=" + p); });
  }

  /* 일치 부분 하이라이트 (현재 페이지) */
  var groups = null, curLocal = -1;
  if (q && hitTurns.length) {
    groups = collectTurnGroups();
    if (qi) curLocal = hitTurns[qi - 1] - (p - 1) * PAGE_TURNS;
    groups.forEach(function (g, li) {
      var isCur = li === curLocal;
      g.blocks.forEach(function (blk) { highlightMatches(blk, q, isCur); });
    });
  }

  /* 스크롤: 턴 앵커 우선, 없으면 현재 일치 턴으로 */
  var t = params.get("t");
  var scrolled = false;
  if (t) {
    var el = document.getElementById("t" + t);
    if (el) { el.scrollIntoView(); scrolled = true; }
  }
  if (!scrolled && groups && curLocal >= 0 && curLocal < groups.length) {
    groups[curLocal].mark.scrollIntoView();
  }
}

/* ---------------- 페이지: 새 기록 / 이어붙이기 ---------------- */

        "지금까지 " + last + " 저장돼 있어요. 새 턴은 " + startNo + "턴부터 이어집니다.</div>";

    '<div class="field"><label>날짜</label><input type="date" id="date" value="' + esc(meta.date) + '" ' + ro + "></div>" +
    '<div class="field"><label>캐릭터 이름 (AI 응답)</label><input type="text" id="character" value="' + esc(meta.character) + '" ' + roB + ' placeholder="예: 한서"></div>' +
    '<div class="field"><label>내 이름 (내가 친 입력)</label><input type="text" id="persona" value="' + esc(meta.persona) + '" ' + roB + ' placeholder="예: 글로리아"></div>' +
    '<div class="field"><label>폴더 (서가)</label>' +
    '<input type="text" id="folder" list="folder-list" value="' + esc(folderVal) + '" ' + roB + ' placeholder="예: 한서 · 비우면 미분류">' +
    '<datalist id="folder-list">' + folderOpts + "</datalist></div>" +
    '<div class="field"><label>태그 (쉼표로 구분)</label><input type="text" id="tags" value="' + esc(meta.tags) + '" placeholder="예: 로판, 글로리아"></div>' +
    "</div>" +
    '<div class="tabs">' +
    '<button class="tab on" id="tab-caps" type="button">턴 입력</button>' +
    '<button class="tab" id="tab-paste" type="button">통짜 붙여넣기</button>' +
    "</div>" +
    '<div id="mode-caps"><div id="caps"></div>' +
    '<button class="btn" id="btn-addcap" type="button">＋ 턴 추가</button>' +
    '<div class="hint" style="margin-top:8px">턴 번호는 자동으로 이어져요. <b>이름:</b> 같은 이름표는 저장할 때 알아서 붙으니 내용만 적으면 됩니다.</div></div>' +
    '<div id="mode-paste" style="display:none"><div class="field"><label>붙여넣기</label>' +
    '<textarea id="text" rows="14" placeholder="채팅을 통째로 붙여넣으세요.&#10;&#10;56턴&#10;글로리아: …&#10;한서: …&#10;&#10;이런 형식이면 턴과 화자를 자동으로 나눠요."></textarea>' +
    '<div class="hint" id="detect-hint">붙여넣으면 화자 이름과 턴 수를 자동으로 감지합니다.</div>' +
    '<div class="hint">내보내기 txt 파일이 있다면 <a href="#/import" style="color:var(--gold);text-decoration:underline">파일 백업</a>에 올리는 게 더 정확해요 (Caveduck · 타임스탬프 · [턴 N] 형식 자동 감지).</div></div></div>' +
    '<div class="actions">' +
    '<button class="btn" id="btn-preview">미리보기</button>' +
    '<button class="btn primary" id="btn-save">저장</button>' +
    '<a class="btn" href="#/">취소</a></div>' +
    '<div class="pv-note" id="msg"></div></div>' +
    '<div class="panel" id="pv-panel" style="display:none"><h2>미리보기</h2><div id="preview"></div>' +
    '<div class="pv-note">저장한 뒤에도 <b>편집</b> 화면에서 자유롭게 고칠 수 있어요.</div></div>';

  layout(appendId ? "기록 이어붙이기" : (branchDoc ? "분기 만들기" : "새 기록"), body, '<a class="btn small" href="#/">서재로</a>');

  var MODE = "caps";
  var detectTimer = null;

  function setMode(m) {
    MODE = m;
    $("mode-caps").style.display = m === "caps" ? "" : "none";
    $("mode-paste").style.display = m === "paste" ? "" : "none";
    $("tab-caps").classList.toggle("on", m === "caps");
    $("tab-paste").classList.toggle("on", m === "paste");
  }
  $("tab-caps").addEventListener("click", function () { setMode("caps"); });
  $("tab-paste").addEventListener("click", function () { setMode("paste"); });

  function addCap(no) {
    var div = document.createElement("div");
    div.className = "cap";
    div.innerHTML =
      '<div class="cap-head">' +
      '<span class="cap-no"><input class="cap-n" type="number" value="' + no + '">턴</span>' +
      '<button class="cap-del" type="button" title="이 턴 삭제">×</button></div>' +
      "<label>내 입력 (페르소나)</label>" +
      '<textarea class="cap-p" rows="2" placeholder="내가 친 입력…"></textarea>' +
      "<label>캐릭터 응답 (AI)</label>" +
      '<textarea class="cap-c" rows="5" placeholder="캐릭터의 응답…"></textarea>';
    $("caps").appendChild(div);
    return div;
  }
  function nextNo() {
    var ns = Array.from(document.querySelectorAll(".cap-n"))
      .map(function (i) { return parseInt(i.value, 10); })
      .filter(function (n) { return !isNaN(n); });
    return ns.length ? Math.max.apply(null, ns) + 1 : startNo;
  }
  $("btn-addcap").addEventListener("click", function () {
    var c = addCap(nextNo());
    c.querySelector(".cap-p").focus();
    c.scrollIntoView({ block: "nearest" });
  });
  $("caps").addEventListener("click", function (e) {
    if (!e.target.classList.contains("cap-del")) return;
    e.target.closest(".cap").remove();
    if (!document.querySelector("#caps .cap")) addCap(startNo);
  });
  /* 자동 높이 조절.
     height="auto"로 잠깐 접히는 순간 문서 전체 높이가 줄어서 브라우저가 스크롤을
     위로 끌어올려 버린다(= 붙여넣기할 때 화면이 맨 위로 튐).
     그래서 접기 전 스크롤 위치를 기억했다가 같은 프레임 안에서 되돌린다. */
  function autoGrow(ta) {
    var x = window.pageXOffset, y = window.pageYOffset;
    ta.style.height = "auto";
    // box-sizing:border-box라서 테두리 두께만큼 더해줘야 글자가 안 잘린다
    var extra = ta.offsetHeight - ta.clientHeight;
    ta.style.height = (ta.scrollHeight + extra) + "px";
    if (window.pageYOffset !== y || window.pageXOffset !== x) window.scrollTo(x, y);
  }
  $("caps").addEventListener("input", function (e) {
    if (e.target.tagName === "TEXTAREA") autoGrow(e.target);
  });
  // 붙여넣기 직후 한 번 더(일부 브라우저는 input 시점 높이 계산이 어긋남)
  $("caps").addEventListener("paste", function (e) {
    if (e.target.tagName !== "TEXTAREA") return;
    var ta = e.target;
    setTimeout(function () { autoGrow(ta); }, 0);
  });
  addCap(startNo);

  $("text").addEventListener("input", function () {
    clearTimeout(detectTimer);
    detectTimer = setTimeout(runDetect, 500);
  });

  function runDetect() {
    var text = $("text").value;
    if (!text.trim()) return;
    var res = C.detectWithVolume(text);
    if (!appendId && !branchDoc) {
      if (res.names[0] && !$("character").value) $("character").value = res.names[0];
      if (res.names[1] && !$("persona").value) $("persona").value = res.names[1];
      if (!$("folder").value && $("character").value) $("folder").value = $("character").value;
    }
    var msg = res.turns > 0 ? res.turns + "개 턴 감지" : "턴 번호 없음 (통째로 1개 기록으로 저장돼요)";
    if (res.names.length >= 2) msg += " · " + res.names[0] + " → 캐릭터, " + res.names[1] + " → 내 입력으로 추정했어요 (다르면 위에서 바꿔주세요)";
    else if (res.names.length === 1) msg += " · 화자 후보: " + res.names[0];
    $("detect-hint").textContent = msg;
  }

  function buildCaps() {
    var chr = $("character").value.trim(), per = $("persona").value.trim();
    var parts = [];
    var needPer = false, needChr = false;
    document.querySelectorAll("#caps .cap").forEach(function (cap) {
      var n = cap.querySelector(".cap-n").value.trim();
      var pv = cap.querySelector(".cap-p").value.trim();
      var cv = cap.querySelector(".cap-c").value.trim();
      if (!pv && !cv) return;
      var s = n ? (n + "턴\n") : "";
      if (pv) { needPer = true; s += (per || "나") + ": " + pv + "\n\n"; }
      if (cv) { needChr = true; s += (chr || "캐릭터") + ": " + cv + "\n"; }
      parts.push(s);
    });
    var err = "";
    if (!parts.length) err = "입력된 턴이 없어요. 캡슐에 내용을 적어주세요.";
    else if (needPer && !per) err = "위의 「내 이름」 칸을 채워주세요. 저장할 때 이름표에 필요해요.";
    else if (needChr && !chr) err = "위의 「캐릭터 이름」 칸을 채워주세요. 저장할 때 이름표에 필요해요.";
    return { text: parts.join("\n"), err: err };
  }

  function getText() {
    if (MODE === "caps") return buildCaps();
    var t = $("text").value;
    return { text: t, err: t.trim() ? "" : "먼저 채팅을 붙여넣어 주세요." };
  }

  function collect(text) {
    return {
      text: text, title: $("title").value, date: $("date").value,
      character: $("character").value.trim(), persona: $("persona").value.trim(),
      folder: $("folder").value.trim(), tags: $("tags").value, append_id: appendId,
      branch_of: branchDoc ? C.baseId(branchDoc.id) : "", branch_at: branchDoc ? branchAt : 0,
    };
  }

  $("btn-preview").addEventListener("click", function () {
    var g = getText();
    if (g.err) { $("msg").textContent = g.err; return; }
    var payload = collect(g.text);
    var pl = C.parsePayload(payload);
    var overlap = [];
    if (appendId) {
      var ad2 = S.index.get(appendId);
      if (ad2) {
        var existing = {};
        ad2.turns.forEach(function (t) { if (t.no !== null) existing[t.no] = 1; });
        var seen = {};
        pl.turns.forEach(function (t) {
          if (t.no !== null && existing[t.no] && !seen[t.no]) { seen[t.no] = 1; overlap.push(t.no); }
        });
        overlap.sort(function (a, b) { return a - b; });
      }
    }
    var blocks = 0;
    pl.turns.forEach(function (t) { blocks += t.blocks.length; });
    $("pv-panel").style.display = "";
    $("preview").innerHTML = '<div class="reader">' + C.renderTurns(pl.turns, pl.persona, pl.character) + "</div>";
    var m = pl.turns.length + "개 턴 · " + blocks + "개 블록으로 나뉘었어요.";
    if (overlap.length) m += " (기존 " + overlap.join(", ") + "턴과 번호가 겹쳐 그 턴에 합쳐집니다)";
    $("msg").textContent = m;
  });

  $("btn-save").addEventListener("click", async function () {
    var g = getText();
    if (g.err) { $("msg").textContent = g.err; return; }
    if (!appendId && !$("title").value.trim()) { $("msg").textContent = "제목을 입력해 주세요."; return; }
    $("btn-save").disabled = true;
    $("msg").textContent = "저장 중…";
    try {
      var payload = collect(g.text);
      var id;
      if (appendId) id = await saveAppend(appendId, payload);
      else id = await saveNew(payload);
      go("/view?id=" + encodeURIComponent(id));
    } catch (e) {
      $("msg").textContent = friendlyErr(e);
      $("btn-save").disabled = false;
    }
  });
}

/* ---------------- 페이지: 파일 백업 (txt 자동 감지) ---------------- */
var LS_IMP_AUTO = "archive-import-auto";
var IMP = { items: [], seq: 0, onFiles: null, busy: false };
var PREVIEW_TURNS = 6;

/* 파일 → 문자열. UTF-8로 못 읽으면 EUC-KR로 한 번 더 시도 */
function readFileText(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () {
      var buf = r.result, text;
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
      catch (e) {
        try { text = new TextDecoder("euc-kr").decode(buf); }
        catch (e2) { text = new TextDecoder("utf-8").decode(buf); }
      }
      resolve(text);
    };
    r.onerror = function () { reject(r.error || new Error("read error")); };
    r.readAsArrayBuffer(file);
  });
}

function pageImport(params) {
  if (!S.index.size && (S.syncing || !S.loaded)) { loadingScreen(); return; }

  var folderDefault = C.cleanFolder(params.get("folder") || "");
  var autoOn = false;
  try { autoOn = localStorage.getItem(LS_IMP_AUTO) === "1"; } catch (e) {}
  IMP.items = [];

  var body =
    '<div class="panel"><h2>파일로 백업</h2>' +

    "<b>txt 파일을 여기에 끌어다 놓으세요</b>" +
    '<span>또는 <span class="link">파일 선택</span> — 여러 개를 한 번에 올려도 돼요</span></div>' +
    '<div class="hint">Caveduck 내보내기(<code>[나]</code> / <code>----</code>), 타임스탬프 대화 내역(<code>[날짜] 이름:</code>), ' +
    "<code>[턴 N]</code> 기록 — 세 가지를 자동으로 알아보고 캐릭터·내 이름·제목·턴을 채워요. " +
    "그 밖의 파일은 통짜 붙여넣기와 같은 방식으로 읽습니다. " +
    "같은 채팅을 통째로 다시 올리면 이미 저장된 턴은 건너뛰고 <b>새 턴만</b> 이어붙이고, " +
    "앞부분은 같은데 어느 턴부터 내용이 달라지면 그 턴부터 <b>분기</b>로 따로 저장해요.</div>" +
    '<label class="chk"><input type="checkbox" id="imp-auto"' + (autoOn ? " checked" : "") +
    "> 올리자마자 바로 저장 (검토 없이 — 자동으로 정한 방법대로)</label>" +
    "</div>" +
    '<div id="imp-list"></div>' +
    '<div class="actions" id="imp-actions" style="display:none">' +
    '<button class="btn primary" id="imp-saveall">모두 저장</button>' +
    '<a class="btn" href="#/">서재로</a>' +
    '<span class="pv-note" id="imp-msg"></span></div>';

  layout("파일 백업", body, '<a class="btn small" href="#/">서재로</a>');

  var drop = $("imp-drop"), input = $("imp-file"), list = $("imp-list");

  function targetOptions() {
    var rows = Array.from(S.index.values());
    rows.sort(function (a, b) {
      var ta = (a.folder ? a.folder + "/" : "") + (a.meta.title || a.id);
      var tb = (b.folder ? b.folder + "/" : "") + (b.meta.title || b.id);
      return ta < tb ? -1 : (ta > tb ? 1 : 0);
    });
    return rows.map(function (d) {
      var lab = (d.folder ? d.folder + " / " : "") + (d.meta.title || d.id) +
        (d.turn_max !== null ? " (~" + d.turn_max + "턴)" : "");
      return '<option value="' + esc(d.id) + '">' + esc(lab) + "</option>";
    }).join("");
  }

  function statLine(p) {
    var st = p.stats, parts = [];
    if (st.numbered) parts.push("<b>" + (st.min !== st.max ? st.min + "~" + st.max + "턴" : st.min + "턴") + "</b> · " + st.numbered + "개");
    else if (st.seq) parts.push("<b>" + st.seq + "턴</b>");
    if (st.intro) parts.push("시작 메시지 포함");
    parts.push(st.blocks + "블록");
    parts.push(C.fmtNum(st.chars) + "자");
    if (p.date) parts.push(esc(p.date));
    return parts.join(" · ");
  }

  /* 자동 분류 결과 → 카드의 「저장 방법」 선택지 */
  function methodOptions(it) {
    var a = it.analysis, opts = [];
    if (a && a.doc) {
      var t = a.doc.meta.title || a.doc.id, k = a.cls.at;
      if (a.cls.kind === "branch" || a.cls.kind === "regen" || a.cls.kind === "edits") {
        opts.push({ v: "branch", label: (k || "?") + "턴부터 「" + t + "」의 분기로 저장 (앞부분은 원본을 참조)" });
      }
      opts.push({ v: "append_keep", label: "「" + t + "」에 새 턴만 이어붙이기 (내용이 다른 턴은 기존 유지)" });
      opts.push({ v: "append_replace", label: "「" + t + "」에 이어붙이고, 내용이 다른 턴은 파일 내용으로 바꾸기" });
    }
    opts.push({ v: "new", label: "완전히 새 기록으로 저장 (전체 턴 따로 저장)" });
    return opts;
  }
  function defaultMethod(it) {
    var a = it.analysis;
    if (!a || !a.doc) return "new";
    if (a.cls.kind === "branch") return "branch";
    if (a.cls.kind === "regen") return "append_replace";
    return "append_keep";                       // append · same · edits
  }
  function analysisNote(it) {
    var a = it.analysis;
    if (!a || !a.doc) return "";
    var t = esc(a.doc.meta.title || a.doc.id), c = a.cls, pre = c.prefix ? "1~" + c.prefix + "턴" : "";
    var msg;
    if (c.kind === "branch") msg = pre + "은 「" + t + "」와 같고, <b>" + c.at + "턴부터 내용이 달라요</b>. 분기로 저장하면 " + c.at + "턴부터만 따로 저장돼요.";
    else if (c.kind === "regen") msg = pre + "은 「" + t + "」와 같고, 마지막 " + c.at + "턴만 달라요. 답변을 다시 뽑은 것으로 보고 그 턴을 파일 내용으로 바꿔요. 갈래를 남기고 싶으면 분기로 저장하세요.";
    else if (c.kind === "edits") msg = "「" + t + "」와 같은 턴·다른 턴이 섞여 있어요(중간 수정). 기본은 새 턴만 이어붙이고 다른 턴은 기존 것을 둬요.";
    else if (c.kind === "same") msg = "「" + t + "」와 내용이 전부 같아요. 저장해도 바뀌는 건 없어요.";
    else if (a.byTitle) msg = "겹치는 내용은 없지만 제목이 같은 「" + t + "」이 있어 그 기록에 이어붙여요.";
    else msg = pre + "은 「" + t + "」와 같아요. 새 턴만 이어붙입니다.";
    return '<div class="notice" style="margin:0 0 12px">' + msg + "</div>";
  }

  function cardHtml(it) {
    var p = it.parsed, k = it.key;
    var hud = p.hasHud
      ? '<label class="chk" style="margin:0 0 10px"><input type="checkbox" class="imp-hud"> 상태창(&lt;StatsHUD&gt;) 블록은 빼고 저장</label>'
      : "";
    var a = it.analysis;
    var targetSel = '<select class="imp-target"><option value="">새 기록으로 저장</option>' + targetOptions() + "</select>";
    var methods = methodOptions(it), def = defaultMethod(it);
    var methodSel = '<select class="imp-method">' + methods.map(function (o) {
      return '<option value="' + o.v + '"' + (o.v === def ? " selected" : "") + ">" + esc(o.label) + "</option>";
    }).join("") + "</select>";
    return '<div class="cap imp-card" data-k="' + k + '">' +
      '<div class="cap-head"><span class="cap-no"><span class="fname" title="' + esc(p.filename) + '">' + esc(p.filename) + "</span>" +
      '<span class="badge">' + esc(p.formatLabel) + "</span></span>" +
      '<button class="cap-del imp-del" type="button" title="목록에서 빼기">×</button></div>' +
      '<div class="imp-stat">' + statLine(p) + "</div>" +
      analysisNote(it) +
      '<div class="field"><label>저장 방법</label>' + methodSel + '<div class="hint imp-target-hint"></div></div>' +
      '<div class="field imp-target-wrap" style="display:none"><label>기준 기록</label>' + targetSel + "</div>" +
      '<div class="grid2">' +
      '<div class="field"><label>제목</label><input type="text" class="imp-title" value="' + esc(p.title) + '"></div>' +
      '<div class="field"><label>날짜</label><input type="date" class="imp-date" value="' + esc(p.date || todayISO()) + '"></div>' +
      '<div class="field"><label>캐릭터 이름 (AI 응답)</label><input type="text" class="imp-character" value="' + esc(p.character) + '" placeholder="파일에서 못 찾았어요 — 직접 입력"></div>' +
      '<div class="field"><label>내 이름 (내가 친 입력)</label><input type="text" class="imp-persona" value="' + esc(p.persona) + '" placeholder="비우면 「나」"></div>' +
      '<div class="field"><label>폴더 (서가)</label><input type="text" class="imp-folder" list="imp-folder-list" value="' + esc(folderDefault || p.character || "") + '" placeholder="비우면 미분류"></div>' +
      '<div class="field"><label>태그 (쉼표로 구분)</label><input type="text" class="imp-tags" value="" placeholder="예: 로판, 분기"></div>' +
      "</div>" +
      hud +
      '<div class="imp-foot">' +
      '<button class="btn small imp-pv" type="button">미리보기</button>' +
      '<button class="btn small primary imp-save" type="button">저장</button>' +
      '<span class="imp-msg"></span></div>' +
      '<div class="imp-preview" style="display:none"></div>' +
      "</div>";
  }

  function readCard(it) {
    var el = it.el;
    var hudEl = el.querySelector(".imp-hud");
    var method = el.querySelector(".imp-method").value;
    var target = method === "new" ? "" : el.querySelector(".imp-target").value;
    var f = {
      method: method,
      title: el.querySelector(".imp-title").value.trim(),
      date: el.querySelector(".imp-date").value.trim(),
      character: el.querySelector(".imp-character").value.trim(),
      persona: el.querySelector(".imp-persona").value.trim() || "나",
      folder: el.querySelector(".imp-folder").value.trim(),
      tags: el.querySelector(".imp-tags").value,
      target: target,
      stripHud: !!(hudEl && hudEl.checked),
      conflict: method === "append_replace" ? "replace" : "keep",
    };
    if (target) {
      var d = S.index.get(target);
      if (d) {
        f.character = (d.meta.character || "").trim();
        f.persona = (d.meta.persona || "").trim() || "나";
      }
    }
    return f;
  }

  /* 화면용 계획 (저장 때는 GitHub 최신본으로 다시 계산) */
  function planFor(it) {
    var f = readCard(it);
    var d = f.target ? S.index.get(f.target) : null;
    if (!d) return null;
    var turns = C.materializeImport(it.parsed, {
      character: f.character || "캐릭터", persona: f.persona, startNo: 1, stripHud: f.stripHud,
    });
    var full = assembleFull(d);
    var plan = C.planAppend(full, turns, { conflict: f.conflict, lockBelow: d.branchAt });
    return { plan: plan, turns: turns, doc: d, cls: C.classifyPlan(C.planAppend(full, turns, { conflict: "keep", lockBelow: d.branchAt }), turns, turnMaxOf(full)) };
  }

  function refreshPlan(it) {
    var el = it.el, hint = el.querySelector(".imp-target-hint");
    var f = readCard(it);
    var wrap = el.querySelector(".imp-target-wrap");
    wrap.style.display = f.method === "new" ? "none" : "";
    var r = planFor(it);
    if (!r) { hint.textContent = f.method === "new" ? "" : "기준 기록을 골라주세요."; return; }
    var st = it.parsed.stats;
    if (f.method === "branch") {
      var at = r.cls.at;
      if (!at) { hint.textContent = "원본과 다른 턴이 없어서 분기로 저장할 수 없어요. 이어붙이기를 고르세요."; return; }
      var n = r.turns.filter(function (t) { return t.no !== null && (t.seq ? t.no + r.plan.offset : t.no) >= at; }).length;
      hint.textContent = at + "턴부터 " + n + "개 턴을 「" + (r.doc.meta.title || r.doc.id) + "」의 분기로 저장해요. 1~" + (at - 1) + "턴은 저장하지 않고 원본을 이어서 보여줍니다. 캐릭터·내 이름·폴더는 원본을 따라요.";
      return;
    }
    var how = st.numbered
      ? "파일의 턴 번호를 그대로 써요. "
      : (r.plan.skipped.length || r.plan.extended.length
        ? "파일의 턴이 기존 " + (1 + r.plan.offset) + "턴부터 이어지는 걸로 봤어요. "
        : "이 파일엔 턴 번호가 없어서 기존 마지막 턴 다음부터 이어붙여요. ");
    hint.textContent = how + C.describePlan(r.plan) + " 이름표는 그 기록의 캐릭터·내 이름을 따릅니다.";
  }

  function onMethodChange(it) {
    var el = it.el, f = readCard(it);
    var d = f.target ? S.index.get(f.target) : null;
    var lockAll = ["imp-title", "imp-date", "imp-character", "imp-persona", "imp-folder", "imp-tags"];
    var lockBranch = ["imp-character", "imp-persona", "imp-folder"];
    var lock = (f.method === "new" || !d) ? [] : (f.method === "branch" ? lockBranch : lockAll);
    lockAll.forEach(function (cls) {
      var inp = el.querySelector("." + cls);
      var locked = lock.indexOf(cls) >= 0;
      if (locked) {
        if (inp.dataset.own === undefined) inp.dataset.own = inp.value;
        inp.readOnly = true;
        var key = cls.replace("imp-", "");
        inp.value = key === "folder" ? d.folder : (d.meta[key] || "");
      } else {
        inp.readOnly = false;
        if (inp.dataset.own !== undefined) { inp.value = inp.dataset.own; delete inp.dataset.own; }
      }
    });
    if (f.method === "branch" && d) {
      var ti = el.querySelector(".imp-title");
      var same = ti.value.trim() === (d.meta.title || "").trim();
      var r = planFor(it);
      if ((!ti.value.trim() || same) && r && r.cls.at) ti.value = (d.meta.title || "기록") + " · " + r.cls.at + "턴 분기";
    }
    refreshPlan(it);
  }

  function setMsg(it, text, isErr) {
    var m = it.el.querySelector(".imp-msg");
    if (!m) return;
    m.textContent = text || "";
    m.classList.toggle("err", !!isErr);
  }

  function preview(it) {
    var pv = it.el.querySelector(".imp-preview");
    if (pv.style.display !== "none") { pv.style.display = "none"; return; }
    var f = readCard(it);
    var turns, note = "";
    if (f.target) {
      var r = planFor(it);
      if (f.method === "branch" && r && r.cls.at) {
        var at = r.cls.at;
        turns = r.turns.filter(function (t) { return t.no !== null && (t.seq ? t.no + r.plan.offset : t.no) >= at; })
          .map(function (t) { return { no: t.seq ? t.no + r.plan.offset : t.no, label: null, blocks: t.blocks }; });
        note = at + "턴부터 분기로 저장되는 부분이에요.";
      } else {
        turns = r ? r.plan.addedTurns : [];
        note = r ? C.describePlan(r.plan) : "";
      }
    } else {
      turns = C.materializeImport(it.parsed, {
        character: f.character || "캐릭터", persona: f.persona, startNo: 1, stripHud: f.stripHud,
      });
    }
    var slice = turns.slice(0, PREVIEW_TURNS);
    pv.innerHTML =
      (note ? '<p class="pv-note" style="margin:0 0 8px">' + esc(note) + "</p>" : "") +
      (slice.length
        ? '<div class="reader">' + C.renderTurns(slice, f.persona, f.character || "캐릭터") + "</div>"
        : '<p class="pv-note">새로 들어갈 턴이 없어요.</p>') +
      (turns.length > PREVIEW_TURNS
        ? '<p class="pv-note">앞 ' + PREVIEW_TURNS + "개만 보여드려요 (전체 " + turns.length + "개). 저장한 뒤 편집 화면에서 언제든 고칠 수 있어요.</p>"
        : "");
    pv.style.display = "";
  }

  function setBusy(it, on) {
    it.el.querySelectorAll("button, input, select").forEach(function (b) { b.disabled = on; });
  }

  function doneLine(it, text, id) {
    it.saved = true; it.id = id;
    it.el.classList.add("saved");
    it.el.querySelector(".imp-foot").innerHTML =
      '<span class="ok">✓ ' + esc(text) + "</span>" +
      '<a class="btn small" href="#/view?id=' + encodeURIComponent(id) + '">열기</a>';
    it.el.querySelector(".imp-preview").style.display = "none";
  }

  async function saveItem(it) {
    if (it.saved) return true;
    var f = readCard(it);
    var p = it.parsed;
    if (f.method !== "new" && !f.target) { setMsg(it, "기준 기록을 골라주세요.", true); return false; }
    if (f.method === "new" || f.method === "branch") {
      if (!f.title) { setMsg(it, "제목을 입력해 주세요.", true); return false; }
    }
    if (f.method === "new" && !f.character && p.stats.chars_ > 0) {
      setMsg(it, "캐릭터 이름을 입력해 주세요. 저장할 때 이름표에 필요해요.", true); return false;
    }
    setBusy(it, true);
    setMsg(it, "저장 중…");
    try {
      if (f.method === "branch") {
        var br = await saveImportedBranch(f.target, p, { stripHud: f.stripHud, title: f.title, date: f.date, tags: f.tags });
        doneLine(it, br.at + "턴부터 분기로 저장했어요 (" + br.count + "개 턴)", br.id);
      } else if (f.target) {
        var res = await saveImportedAppend(f.target, p, { stripHud: f.stripHud, conflict: f.conflict });
        var pl = res.plan;
        if (!res.wrote) {
          doneLine(it, "새 턴이 없어요 — 이미 전부 저장돼 있어요" +
            (pl.conflicts.length ? " (내용이 다른 " + pl.conflicts.length + "개 턴은 기존 것을 유지)" : ""), res.id);
        } else {
          var bits = [];
          if (pl.added.length) bits.push("새 턴 " + pl.added.length + "개");
          if (pl.extended.length) bits.push(pl.extended.length + "개 보강");
          if (pl.replaced.length) bits.push(pl.replaced.length + "개 교체");
          if (pl.introAdded) bits.push("시작 메시지");
          var skip = pl.skipped.length ? " · 이미 있던 " + pl.skipped.length + "개 턴은 건너뜀" : "";
          doneLine(it, bits.join(", ") + " 이어붙였어요" + skip, res.id);
        }
      } else {
        var turns = C.materializeImport(p, {
          character: f.character, persona: f.persona, startNo: 1, stripHud: f.stripHud,
        });
        var id = await saveImportedNew({
          title: f.title, character: f.character, persona: f.persona, date: f.date,
          folder: f.folder, tags: f.tags, source: "file:" + p.format,
        }, turns);
        doneLine(it, "저장했어요", id);
      }
      return true;
    } catch (e) {
      setBusy(it, false);
      setMsg(it, friendlyErr(e), true);
      return false;
    }
  }

  function unsaved() { return IMP.items.filter(function (it) { return !it.saved; }); }
  function updateActions() {
    var n = unsaved().length;
    $("imp-actions").style.display = IMP.items.length ? "" : "none";
    $("imp-saveall").disabled = !n || IMP.busy;
    $("imp-saveall").textContent = n > 1 ? "모두 저장 (" + n + "개)" : "모두 저장";
  }

  async function saveAll() {
    if (IMP.busy) return;
    IMP.busy = true; updateActions();
    var todo = unsaved(), ok = 0, fail = 0;
    for (var i = 0; i < todo.length; i++) {
      $("imp-msg").textContent = (i + 1) + "/" + todo.length + " 저장 중…";
      if (await saveItem(todo[i])) ok++; else fail++;
    }
    IMP.busy = false; updateActions();
    $("imp-msg").textContent = ok + "개 저장" + (fail ? " · " + fail + "개는 실패했어요 (각 카드의 안내를 확인해 주세요)" : "했어요.");
  }

  function addCard(parsed) {
    var it = { key: ++IMP.seq, parsed: parsed, saved: false, id: null, el: null, analysis: analyzeUpload(parsed, false) };
    var wrap = document.createElement("div");
    wrap.innerHTML = cardHtml(it);
    it.el = wrap.firstElementChild;
    list.appendChild(it.el);
    IMP.items.push(it);
    if (it.analysis && it.analysis.doc) it.el.querySelector(".imp-target").value = it.analysis.doc.id;
    it.el.querySelector(".imp-method").addEventListener("change", function () { onMethodChange(it); });
    it.el.querySelector(".imp-target").addEventListener("change", function () { onMethodChange(it); });
    var hudEl = it.el.querySelector(".imp-hud");
    if (hudEl) hudEl.addEventListener("change", function () { refreshPlan(it); });
    it.el.querySelector(".imp-pv").addEventListener("click", function () { preview(it); });
    it.el.querySelector(".imp-save").addEventListener("click", function () { saveItem(it).then(updateActions); });
    it.el.querySelector(".imp-del").addEventListener("click", function () {
      IMP.items = IMP.items.filter(function (x) { return x !== it; });
      it.el.remove();
      updateActions();
    });
    onMethodChange(it);
    return it;
  }

  function addErrorCard(name, why) {
    var div = document.createElement("div");
    div.className = "cap imp-card";
    div.innerHTML = '<div class="cap-head"><span class="cap-no"><span class="fname">' + esc(name) + "</span>" +
      '<span class="badge warn">읽지 못함</span></span>' +
      '<button class="cap-del" type="button" title="목록에서 빼기">×</button></div>' +
      '<div class="imp-stat">' + esc(why) + "</div>";
    div.querySelector(".cap-del").addEventListener("click", function () { div.remove(); });
    list.appendChild(div);
  }

  async function handleFiles(files) {
    var arr = Array.from(files || []);
    if (!arr.length) return;
    $("imp-msg").textContent = "";
    for (var i = 0; i < arr.length; i++) {
      var file = arr[i];
      try {
        var text = await readFileText(file);
        if (!text.trim()) { addErrorCard(file.name, "빈 파일이에요."); continue; }
        var parsed = C.parseImportText(text, file.name);
        if (!parsed.turns.length) { addErrorCard(file.name, "대화를 찾지 못했어요. 지원하는 세 형식인지 확인해 주세요."); continue; }
        addCard(parsed);
      } catch (e) {
        addErrorCard(file.name, "읽지 못했어요: " + ((e && e.message) || e));
      }
    }
    input.value = "";
    updateActions();
    if ($("imp-auto").checked && unsaved().length) saveAll();
  }
  IMP.onFiles = handleFiles;

  /* 드롭존 */
  drop.addEventListener("click", function () { input.click(); });
  drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", function () { handleFiles(input.files); });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.add("over"); });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); e.stopPropagation(); drop.classList.remove("over");
    handleFiles(e.dataTransfer && e.dataTransfer.files);
  });

  $("imp-auto").addEventListener("change", function () {
    try { localStorage.setItem(LS_IMP_AUTO, this.checked ? "1" : "0"); } catch (e) {}
  });
  $("imp-saveall").addEventListener("click", saveAll);

  /* 폴더 자동완성 목록 (카드마다 공유) */
  var dl = document.createElement("datalist");
  dl.id = "imp-folder-list";
  dl.innerHTML = C.allFolders(S.index).map(function (kv) { return '<option value="' + esc(kv[0]) + '">'; }).join("");
  list.appendChild(dl);
}

/* ---------------- 페이지: 편집 ---------------- */
function pageEdit(params) {
  var id = params.get("id") || "";
  var d = S.index.get(id);
  if (!d) {
    if (S.syncing || !S.loaded) { loadingScreen(); return; }
    layout("없음", '<div class="empty" style="margin-top:40px"><b>기록을 찾을 수 없어요</b></div>',
      '<a class="btn small" href="#/">서재로</a>');
    return;
  }
  var qid = encodeURIComponent(id);
  var folderOpts = C.allFolders(S.index).map(function (kv) {
    return '<option value="' + esc(kv[0]) + '">';
  }).join("");

  var body =
    '<div class="panel"><h2>원본 편집</h2>' +
    '<div class="hint" style="margin-bottom:10px">맨 위 ---&nbsp;사이가 정보(제목·이름·태그), 아래가 본문이에요. ' +
    "<b>## 56턴</b>이 턴 구분, <b>**이름:**</b>이 화자 구분입니다.</div>" +
    '<div class="field" style="max-width:320px"><label>폴더 (서가) — 바꾸면 파일이 실제로 이동해요</label>' +
    '<input type="text" id="folder" list="folder-list" value="' + esc(d.folder) + '" placeholder="비우면 미분류">' +
    '<datalist id="folder-list">' + folderOpts + "</datalist></div>" +
    '<div class="field"><textarea id="raw" rows="26" spellcheck="false">' + esc(d.raw) + "</textarea></div>" +
    '<div class="actions">' +
    '<button class="btn primary" id="btn-save">저장</button>' +
    '<a class="btn" href="#/view?id=' + qid + '">취소</a>' +
    '<span class="spacer"></span>' +
    '<button class="btn danger" id="btn-del">이 기록 삭제</button></div>' +
    '<div class="pv-note" id="msg"></div></div>';

  layout("편집", body, '<a class="btn small" href="#/view?id=' + qid + '">읽기로</a>');

  $("btn-save").addEventListener("click", async function () {
    $("btn-save").disabled = true;
    $("msg").textContent = "저장 중…";
    try {
      var newId = await updateDoc(id, $("raw").value, $("folder").value.trim());
      go("/view?id=" + encodeURIComponent(newId));
    } catch (e) {
      $("msg").textContent = friendlyErr(e);
      $("btn-save").disabled = false;
    }
  });
  $("btn-del").addEventListener("click", async function () {
    if (!confirmDelete(d, false)) return;
    $("btn-del").disabled = true;
    $("msg").textContent = "삭제 중…";
    try {
      await deleteDoc(id);
      go("/");
    } catch (e) {
      $("msg").textContent = friendlyErr(e);
      $("btn-del").disabled = false;
    }
  });
}

/* ================================================================
   갤러리 — 이미지 전용 저장소 (텍스트 저장소와 분리)
   · 저장소 트리에서 이미지 파일만 골라 "첫 폴더 = 캐릭터"로 묶어 보여준다
   · 비공개 저장소라 <img src>로 바로 못 불러오므로 토큰을 붙여 blob으로 받는다
   · 받은 원본/썸네일은 브라우저 Cache API에 sha 기준으로 저장 → 두 번째부턴 요청 없음
   ================================================================ */
var IMG_EXT = /\.(png|jpe?g|webp|gif|avif|bmp|svg)$/i;
var IMG_MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp",
  gif: "image/gif", avif: "image/avif", bmp: "image/bmp", svg: "image/svg+xml" };
var GAL_ALL = "*", GAL_ROOT = "~";        // ?folder= 특수값: 전체 / 미분류(저장소 최상위)
var THUMB_MAX = 512;                       // 썸네일 긴 변
var UP_MAX = 2048;                         // 올릴 때 WebP 변환 긴 변
var FULL_KEEP = 16;                        // 세션 중 메모리에 들고 있을 원본 object URL 수
var LS_GAL_WEBP = "archive-gallery-webp";
var GAL = { onFiles: null };
/* 폴더별 표시 순서: <폴더>/.order.json 에 {"order":["a.webp","b.webp",…]} 로 저장 (미분류는 저장소 최상위) */
var ORDER_FILE = ".order.json";
var ORDER_RE = /^(?:([^\/]+)\/)?\.order\.json$/;
/* 순서 바꾸기 모드 상태 (화면을 다시 그리면 항상 꺼진다) */
var ARR = { on: false, grid: null, els: null, fname: null, drag: null, onKey: null };

var G = {
  items: [], loaded: false, syncing: false, syncP: null, lastSync: 0, err: null, offline: false,
  branch: null, repoPrivate: null, busy: false, lastMsg: null,
  order: {},           // folder -> { sha, names[] } (.order.json 내용, sha로 캐시 확인)
  turl: {},            // sha -> 썸네일 object URL
  furl: {}, ford: [],  // sha -> 원본 object URL (+ 순서, 오래된 것부터 해제)
};

function imgCfg() {
  var c = getCfg();
  return { repo: (c.imgRepo || "").trim(), token: (c.imgToken || c.token || "").trim(), branch: (c.imgBranch || "").trim() };
}
function imgCfgOk() {
  var c = imgCfg();
  return !!(c.token && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(c.repo));
}
function galCacheKey() { return "archive-gallery::" + imgCfg().repo; }
function loadGalCache() {
  try { return JSON.parse(localStorage.getItem(galCacheKey()) || "null"); } catch (e) { return null; }
}
function saveGalCache() {
  try {
    localStorage.setItem(galCacheKey(), JSON.stringify({
      branch: G.branch,
      items: G.items.map(function (i) { return [i.path, i.sha, i.size]; }),
      order: G.order,
    }));
  } catch (e) {}
}
function galStoreName() { return "archive-img::" + imgCfg().repo; }
async function clearGalStore() {
  try { localStorage.removeItem(galCacheKey()); } catch (e) {}
  if (window.caches) { try { await caches.delete(galStoreName()); } catch (e) {} }
}
function resetGallery() {
  Object.keys(G.turl).forEach(function (k) { try { URL.revokeObjectURL(G.turl[k]); } catch (e) {} });
  Object.keys(G.furl).forEach(function (k) { try { URL.revokeObjectURL(G.furl[k]); } catch (e) {} });
  G.items = []; G.loaded = false; G.syncing = false; G.syncP = null; G.lastSync = 0; G.err = null;
  G.offline = false; G.branch = null; G.repoPrivate = null; G.busy = false; G.lastMsg = null;
  G.order = {}; G.turl = {}; G.furl = {}; G.ford = [];
}
function hydrateGallery() {
  if (!imgCfgOk()) return;
  var c = loadGalCache();
  if (!c || !c.items) return;
  G.branch = c.branch || null;
  G.order = {};
  if (c.order && typeof c.order === "object") {
    Object.keys(c.order).forEach(function (f) {
      var o = c.order[f];
      if (o && typeof o.sha === "string" && Array.isArray(o.names)) G.order[f] = { sha: o.sha, names: o.names.filter(function (n) { return typeof n === "string"; }) };
    });
  }
  G.items = c.items.map(function (a) { return itemFromPath(a[0], a[1], a[2]); });
  sortItems(G.items);
  if (G.items.length) G.loaded = true;
}

function itemFromPath(path, sha, size) {
  var i = path.indexOf("/");
  return { path: path, sha: sha, size: size || 0,
    folder: i < 0 ? "" : path.slice(0, i), name: i < 0 ? path : path.slice(i + 1) };
}
var COLL = new Intl.Collator("ko", { numeric: true, sensitivity: "base" });
/* 폴더순 → 저장된 순서(.order.json) → 순서에 없는 것(새로 올린 것 등)은 뒤에 이름순 */
function sortItems(items) {
  var lut = new Map();
  Object.keys(G.order).forEach(function (f) {
    var m = new Map();
    (G.order[f].names || []).forEach(function (n, i) { if (!m.has(n)) m.set(n, i); });
    lut.set(f, m);
  });
  function oi(it) { var m = lut.get(it.folder); return m && m.has(it.name) ? m.get(it.name) : -1; }
  items.sort(function (a, b) {
    var c = COLL.compare(a.folder, b.folder);
    if (c) return c;
    var ia = oi(a), ib = oi(b);
    if (ia !== ib) {
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    }
    return COLL.compare(a.name, b.name);
  });
}
function orderPath(folder) { return folder ? folder + "/" + ORDER_FILE : ORDER_FILE; }
/* 트리에서 .order.json 들을 찾아 내용을 읽는다. sha가 캐시와 같으면 요청 없음. 못 읽으면 그 폴더는 이름순 */
async function loadOrders(tree, ic) {
  var found = {};
  tree.forEach(function (it) {
    if (it.type !== "blob") return;
    var m = ORDER_RE.exec(it.path);
    if (m) found[m[1] || ""] = it.sha;
  });
  var next = {};
  await Promise.all(Object.keys(found).map(async function (f) {
    var sha = found[f], prev = G.order[f];
    if (prev && prev.sha === sha) { next[f] = prev; return; }
    try {
      var b = await gh("/repos/" + ic.repo + "/git/blobs/" + sha, { token: ic.token });
      var j = JSON.parse(b64dec(b.content));
      var names = Array.isArray(j) ? j : (j && Array.isArray(j.order) ? j.order : []);
      next[f] = { sha: sha, names: names.filter(function (n) { return typeof n === "string"; }) };
    } catch (e) {
      if (prev) next[f] = prev;   // 이번엔 못 읽음 — 이전 내용으로 버티고 다음 동기화 때 다시
    }
  }));
  G.order = next;
}
/* 폴더의 표시 순서를 .order.json 으로 저장 (커밋 1번). sha가 어긋나면 최신 sha로 한 번 더 */
async function saveOrder(folder, names) {
  var ic = imgCfg(), url = "/repos/" + ic.repo + "/contents/" + encPath(orderPath(folder));
  var body = {
    message: "이미지 순서 변경: " + folderLabel(folder),
    content: b64enc(JSON.stringify({ order: names }, null, 2) + "\n"),
  };
  if (G.branch) body.branch = G.branch;
  var ex = G.order[folder];
  if (ex && ex.sha) body.sha = ex.sha;
  var r;
  try {
    r = await gh(url, { method: "PUT", token: ic.token, body: body });
  } catch (e) {
    if (e.status !== 409 && e.status !== 422) throw e;
    var cur = null;
    try { cur = await gh(url + (G.branch ? "?ref=" + encodeURIComponent(G.branch) : ""), { token: ic.token }); } catch (e2) {}
    if (cur && cur.sha) body.sha = cur.sha; else delete body.sha;
    r = await gh(url, { method: "PUT", token: ic.token, body: body });
  }
  G.order[folder] = { sha: r.content.sha, names: names.slice() };
  sortItems(G.items);
  saveGalCache();
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return Math.round(n / 1024) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function mimeOf(name) {
  var m = /\.([a-z0-9]+)$/i.exec(name);
  return (m && IMG_MIME[m[1].toLowerCase()]) || "application/octet-stream";
}
function folderLabel(f) { return f === "" ? "미분류" : f; }
function folderParam(f) { return f === "" ? GAL_ROOT : f; }
function galFolders() {   // [{name, items, size}] — 이름순, 미분류는 맨 뒤
  var by = new Map();
  G.items.forEach(function (it) {
    var f = by.get(it.folder);
    if (!f) { f = { name: it.folder, items: [], size: 0 }; by.set(it.folder, f); }
    f.items.push(it); f.size += it.size;
  });
  var arr = Array.from(by.values());
  arr.sort(function (a, b) {
    if (a.name === "") return 1;
    if (b.name === "") return -1;
    return COLL.compare(a.name, b.name);
  });
  return arr;
}
function galErr(e) {
  if (e && e.friendly) return e.message;
  if (e && e.status === 404) return "이미지 저장소를 찾을 수 없어요. 설정의 이미지 저장소 이름과 토큰 권한(해당 저장소 Contents 읽기·쓰기)을 확인해 주세요.";
  return friendlyErr(e);
}

/* ---------------- 서가 ↔ 갤러리 연결: 이름이 같으면 서로 링크 ---------------- */
function normName(s) { return String(s || "").trim().toLowerCase(); }

/* 서가 폴더 이름/캐릭터 이름과 같은 갤러리 폴더 → {name, items, size} */
function galFolderNamed(name) {
  var key = normName(name);
  if (!key || !imgCfgOk() || !G.items.length) return null;
  var found = null;
  galFolders().some(function (f) {
    if (f.name && normName(f.name) === key) { found = f; return true; }
    return false;
  });
  return found;
}
/* 서가 쪽에 붙이는 링크. names는 우선순위대로 후보 (폴더, 캐릭터). 없으면 create일 때만 "만들기" 링크 */
function galLinkHtml(names, create) {
  if (!imgCfgOk()) return "";
  var f = null;
  names.some(function (n) { f = galFolderNamed(n); return !!f; });
  if (f) {
    return ' · <a href="#/gallery' + qs({ folder: folderParam(f.name) }) + '" title="갤러리에서 보기">갤러리 「' +
      esc(f.name) + "」 " + f.items.length + "장 →</a>";
  }
  var n0 = cleanGalFolder(names[0] || "");
  if (!create || !n0) return "";
  return ' · <a href="#/gallery' + qs({ folder: n0 }) + '" title="갤러리에 같은 이름의 폴더를 열어 이미지를 올려요">갤러리에 「' + esc(n0) + "」 폴더 만들기</a>";
}
/* 갤러리 폴더 이름과 같은 서가 폴더 → 없으면 같은 이름의 캐릭터 → {kind, name, count} */
function shelfMatch(name) {
  var key = normName(name);
  if (!key) return null;
  var found = null;
  C.allFolders(S.index).some(function (kv) {
    if (normName(kv[0]) === key) { found = { kind: "folder", name: kv[0], count: kv[1].count }; return true; }
    return false;
  });
  if (found) return found;
  C.allCharacters(S.index).some(function (kv) {
    if (normName(kv[0]) === key) { found = { kind: "who", name: kv[0], count: kv[1] }; return true; }
    return false;
  });
  return found;
}
function shelfLinkHtml(name) {
  var m = shelfMatch(name);
  if (!m) return "";
  return m.kind === "folder"
    ? ' · <a href="#/' + qs({ folder: m.name }) + '" title="서가에서 보기">서가 「' + esc(m.name) + "」 " + m.count + "개 기록 →</a>"
    : ' · <a href="#/' + qs({ who: m.name }) + '" title="이 캐릭터의 기록만 보기">「' + esc(m.name) + "」 기록 " + m.count + "개 →</a>";
}
function shelfNoteText(name) {
  var m = shelfMatch(name);
  return m ? " · 기록 " + m.count + "개" : "";
}

/* ---------------- 동기화: 트리 한 번으로 목록 전부 ---------------- */
function syncGallery(force) {
  if (G.syncing) return G.syncP;
  if (!force && G.lastSync && (Date.now() - G.lastSync < 60000)) return Promise.resolve();
  if (!imgCfgOk()) return Promise.resolve();
  G.syncing = true;
  G.err = null;
  G.syncP = (async function () {
    var ic = imgCfg();
    var repo = await gh("/repos/" + ic.repo, { token: ic.token });
    G.repoPrivate = !!repo.private;
    G.branch = ic.branch || repo.default_branch || "main";
    var tree = [];
    try {
      var t = await gh("/repos/" + ic.repo + "/git/trees/" + encodeURIComponent(G.branch) + "?recursive=1", { token: ic.token });
      tree = t.tree || [];
    } catch (e) {
      if (e.status === 404 || e.status === 409) tree = [];   // 빈 저장소
      else throw e;
    }
    var items = [];
    tree.forEach(function (it) {
      if (it.type !== "blob" || !IMG_EXT.test(it.path)) return;
      if (it.path.split("/").some(function (seg) { return seg[0] === "."; })) return;   // .github 등은 제외
      items.push(itemFromPath(it.path, it.sha, it.size || 0));
    });
    await loadOrders(tree, ic);
    sortItems(items);
    G.items = items;
    G.loaded = true;
    G.offline = false;
    G.lastSync = Date.now();
    saveGalCache();
  })().catch(function (e) {
    G.err = galErr(e);
    if (G.items.length) { G.offline = true; G.loaded = true; }
  }).finally(function () {
    G.syncing = false;
    if (formIsOpen()) return;
    render();   // 갤러리뿐 아니라 서가·리더의 연결 링크도 최신 목록 기준으로
  });
  return G.syncP;
}
/* 서가·리더에서는 세션에 한 번만 목록을 받아 온다 (연결 링크용, 트리 요청 1회) */
function syncGalleryOnce() {
  if (G.lastSync || G.syncing || G.err || !imgCfgOk()) return;
  syncGallery(true);
}

/* ---------------- 이미지 받기 + Cache API ---------------- */
async function galStore() {
  if (!window.caches) return null;
  try { return await caches.open(galStoreName()); } catch (e) { return null; }
}
function cacheReq(kind, sha) { return "https://archive-gallery.invalid/" + kind + "/" + sha; }

function b64decBytes(b64) {
  var bin = atob(String(b64).replace(/\s+/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function b64encBytes(bytes) {
  var bin = "";
  for (var i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

/* blob sha로 원본 받기 — raw 미디어 타입 우선, 안 되면 base64 JSON으로 */
async function fetchBlobRaw(sha, mime) {
  var ic = imgCfg();
  var base = API + "/repos/" + ic.repo + "/git/blobs/" + sha;
  var res = await fetch(base, {
    headers: {
      "Authorization": "Bearer " + ic.token,
      "Accept": "application/vnd.github.raw+json",
      "X-GitHub-Api-Version": "2022-11-28",
    },
  });
  if (res.ok) {
    var ct = res.headers.get("content-type") || "";
    if (!/json/i.test(ct)) return new Blob([await res.arrayBuffer()], { type: mime });
    try {
      var j = await res.json();
      if (j && j.content) return new Blob([b64decBytes(j.content)], { type: mime });
    } catch (e) {}
    throw new Error("빈 응답");
  }
  if (res.status === 406 || res.status === 415) {
    var b = await gh("/repos/" + ic.repo + "/git/blobs/" + sha, { token: ic.token });
    return new Blob([b64decBytes(b.content)], { type: mime });
  }
  var err = new Error("HTTP " + res.status);
  err.status = res.status;
  try { var d = await res.json(); if (d && d.message) err.message = d.message; } catch (e) {}
  throw err;
}

async function getFull(item) {
  var c = await galStore();
  if (c) {
    try { var hit = await c.match(cacheReq("full", item.sha)); if (hit) return await hit.blob(); } catch (e) {}
  }
  var blob = await fetchBlobRaw(item.sha, mimeOf(item.name));
  if (c) { try { await c.put(cacheReq("full", item.sha), new Response(blob)); } catch (e) {} }
  return blob;
}

async function makeThumb(blob, max) {
  max = max || THUMB_MAX;
  if (blob.type === "image/svg+xml") return blob;
  try {
    var bmp = await createImageBitmap(blob);
    var w = bmp.width, h = bmp.height;
    if (Math.max(w, h) <= max && blob.size < 160000) { bmp.close(); return blob; }
    var s = Math.min(1, max / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    cv.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
    bmp.close();
    var out = await new Promise(function (res) { cv.toBlob(res, "image/webp", 0.82); });
    if (!out) return blob;
    return out.size < blob.size ? out : blob;
  } catch (e) { return blob; }
}

async function getThumb(item) {
  var c = await galStore();
  if (c) {
    try { var hit = await c.match(cacheReq("thumb", item.sha)); if (hit) return await hit.blob(); } catch (e) {}
  }
  var full = await getFull(item);
  var th = await makeThumb(full);
  if (c) { try { await c.put(cacheReq("thumb", item.sha), new Response(th)); } catch (e) {} }
  return th;
}

function keepFull(sha, url) {
  if (G.furl[sha]) { try { URL.revokeObjectURL(url); } catch (e) {} return G.furl[sha]; }
  G.furl[sha] = url;
  G.ford.push(sha);
  while (G.ford.length > FULL_KEEP) {
    var old = G.ford.shift();
    if (old === sha) continue;
    try { URL.revokeObjectURL(G.furl[old]); } catch (e) {}
    delete G.furl[old];
  }
  return url;
}

/* ---------------- 썸네일 큐: 화면에 보이는 것부터, 동시 4장 ---------------- */
var TQ = { q: [], active: 0, max: 4, io: null };
function tqObserve(el, item) {
  el._item = item;
  var url = G.turl[item.sha];
  var img = el.querySelector("img");
  if (url && img) { img.onload = function () { img.classList.add("ready"); }; img.src = url; return; }
  if (!("IntersectionObserver" in window)) { tqPush(el); return; }
  if (!TQ.io) {
    TQ.io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return;
        TQ.io.unobserve(en.target);
        tqPush(en.target);
      });
    }, { rootMargin: "600px 0px" });
  }
  TQ.io.observe(el);
}
function tqPush(el) { TQ.q.push(el); tqPump(); }
function tqPump() {
  while (TQ.active < TQ.max && TQ.q.length) {
    var el = TQ.q.shift();
    if (!el.isConnected) continue;
    TQ.active++;
    loadThumbInto(el).finally(function () { TQ.active--; tqPump(); });
  }
}
async function loadThumbInto(el) {
  var item = el._item, img = el.querySelector("img");
  if (!item || !img) return;
  try {
    var url = G.turl[item.sha];
    if (!url) {
      var blob = await getThumb(item);
      url = G.turl[item.sha] || (G.turl[item.sha] = URL.createObjectURL(blob));
    }
    img.onload = function () { img.classList.add("ready"); };
    img.src = url;
  } catch (e) {
    if (!el.isConnected) return;
    var er = document.createElement("div");
    er.className = "gerr";
    er.textContent = (e && e.status === 403 && /rate limit/i.test(e.message || "")) ? "요청 한도 초과 — 잠시 후" : "불러오기 실패";
    er.title = galErr(e);
    el.appendChild(er);
  }
}

/* ---------------- 라이트박스 ---------------- */

}
function openLightbox(list, idx) {

  async function show(k) {

    cur = list[i];
    var my = ++seq;
    lb.querySelector(".pos").textContent = (i + 1) + " / " + list.length;

    if (t) img.src = t; else img.removeAttribute("src");

  });
  $("lb-del").addEventListener("click", async function () {

  lb.addEventListener("touchend", function (e) {
